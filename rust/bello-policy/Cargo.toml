[package]
name = "bello-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
npyz = "0.9.1"
glam = "0.33"
mujoco-rs = { version = "=6.0.1", default-features = false }
bello-hardware-client.workspace = true
bello-pose-api.workspace = true
robstride-protocol.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
futures-util = "0.3"
serde_yaml.workspace = true
tonic.workspace = true
prost = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["sync", "net"] }

[build-dependencies]
tonic-prost-build = "0.14"
