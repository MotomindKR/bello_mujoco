syntax = "proto3";
package bello.reference.v1;

// Latest retargeted robot reference. This service never owns motor control.
service ReferenceService {
  rpc GetReference(GetReferenceRequest) returns (GetReferenceResponse);
}
message GetReferenceRequest { string robot = 1; }
message GetReferenceResponse {
  string robot = 1;
  bool available = 2;
  uint64 sequence = 3;
  // Includes vision/retargeting age; consumer adds RPC and local residence time.
  double source_age_ms = 4;
  repeated string joint_names = 5;
  repeated double position = 6; // URDF joint coordinates, radians.
  repeated double velocity = 7; // Radians/second.
  // Exactly three radians, required when available: anatomical torso roll/pitch
  // relative to level ground and yaw relative to pelvis heading, with the
  // nominal robot CAD orientation removed. Same sample as the joint references.
  repeated double torso_command = 8;
  // Same retargeted sample, with all actuated joints for SONIC. Optional for
  // producers that only support upper-body following. Root is world Z-up.
  FullBodyReference full_body = 9;
}

message FullBodyReference {
  repeated string joint_names = 1;
  repeated double position = 2;
  repeated double velocity = 3;
  repeated double root_orientation_wxyz = 4;
}
