syntax = "proto3";
package bello.operator.v1;

service OperatorService {
  rpc Exchange(stream OperatorInput) returns (stream OperatorStatus);
}

message OperatorInput {
  // Strictly increasing within one operator session. Samples arrive every 20 ms.
  uint64 sequence = 1;
  uint64 sample_monotonic_ns = 2;
  bool connected = 3;
  string name = 4;
  // Normalized movement intent in [-1, 1]: forward, right, counterclockwise yaw.
  // The runner projects this into the bundle command frame and enforces limits.
  // During Barbell's grab step, forward adjusts grip (positive tightens);
  // other axes and all axes after grasp confirmation do not change the grip.
  double forward = 5;
  double lateral = 6;
  double yaw = 7;
  // The console reports physical input neutrality; the runner also checks axes
  // and actions. This prevents a held unmapped control from arming on reconnect.
  bool controls_neutral = 8;
  // Continuously asserted while held. The runner owns hold timing and transitions.
  bool request_hold = 9;
  bool confirm_startup = 10;
  // Target mode, or Stand to exit Locomotion/Tracking. Must match the selected
  // choice where selection applies. The runner requires a fresh one-second hold.
  string request_mode = 11;
  bool confirm_sit = 12;
  bool abort = 13;
  // One-shot console request after fault cleanup; accepted only at neutral input.
  bool clear_fault = 14;
  // One-shot semantic selection and navigation actions.
  Selection selection = 15;
  sint32 mode_step = 16;
  sint32 motion_step = 17;
  bool toggle_tracking = 18;
  uint32 input_protocol_version = 19;
  // Neutrality excluding the abort control itself, for Fault-to-Idle recovery.
  bool abort_other_controls_neutral = 20;
  bool confirm_fault_recovery = 21;
  // True while a mode or motion selection control is held.
  bool navigating = 22;
  // Confirmation is bound to the runner's current handoff generation.
  string confirm_barbell = 23;
  uint64 barbell_phase_id = 24;
  bool request_barbell_stop = 25;
  // Physical A hold remains asserted even when no handoff prompt is available.
  bool barbell_confirm_held = 26;
}

message Selection {
  reserved 3;
  oneof choice {
    string mode = 1;
    string motion = 2;
    bool tracking_enabled = 4;
    string startup = 5;
  }
}

enum Mode {
  MODE_DISARMED = 0;
  MODE_HOLD = 1;
  MODE_STAND = 2;
  MODE_LOCOMOTION = 3;
  MODE_MOTION = 4;
  MODE_FAULT = 5;
  MODE_TRACKING = 6;
  MODE_SIT = 7;
  MODE_BARBELL = 8;
}

message OperatorStatus {
  Mode mode = 1;
  string selected = 2;
  string active_motion = 3;
  string phase = 4;
  double progress = 5;
  string fault = 6;
  bool controller_connected = 7;
  bool neutral_required = 8;
  repeated string modes = 9;
  bool can_clear_fault = 10;
  string recovery_error = 11;
  uint64 clear_fault_sequence = 12;
  // Requested locomotion velocity in operator axes; absent outside Locomotion.
  VelocityCommand velocity_command = 13;
  repeated string motions = 14;
  string selected_motion = 15;
  // Runner-timed hold progress in [0, 1]; zero when cancelled/released.
  double hold_progress = 16;
  double confirm_progress = 17;
  double abort_progress = 18;
  reserved 19;
  bool tracking_available = 20;
  bool tracking_enabled = 21;
  bool tracking_live = 22;
  // Full-body SONIC readiness is independent of upper-body teleop above.
  bool sonic_ready = 23;
  double sonic_reference_age_ms = 24;
  double sonic_buffered_ms = 25;
  double sonic_delay_ms = 26;
  string sonic_status = 27;
  repeated string startups = 28;
  string selected_startup = 29;
  // Assisted startup/Sit phase can accept a fresh confirmation.
  bool startup_ready = 30;
  // Console must check this before sending operator input.
  uint32 input_protocol_version = 31;
  BarbellStatus barbell = 32;
}

message VelocityCommand {
  double forward_mps = 1;
  double right_mps = 2;
  double yaw_rps = 3; // Positive counterclockwise.
}

message BarbellStatus {
  uint64 phase_id = 1;
  string awaiting = 2;
  bool confirmation_ready = 3;
  bool hands_owned = 4;
  double load_fraction = 5;
  double motion_weight = 6;
  string message = 7;
  // Requested normalized hand closure, not measured force.
  double grip_closure = 8;
  bool grip_adjustable = 9;
}
