name: Policy console
on:
  push:
    tags: ['console-v*']
  pull_request:
    paths: ['console/**', 'rust/bello-policy/proto/operator.proto', 'deps/bello-stack', 'deps/pico-smplx-bridge', '.github/workflows/console.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - id: stack
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD:deps/bello-stack)" >> "$GITHUB_OUTPUT"
          echo "tracking=$(git rev-parse HEAD:deps/pico-smplx-bridge)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: MotomindKR/bello-stack
          ref: ${{ steps.stack.outputs.revision }}
          path: deps/bello-stack
          ssh-key: ${{ secrets.BELLO_STACK_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: MotomindKR/pico-smplx-bridge
          ref: ${{ steps.stack.outputs.tracking }}
          path: deps/pico-smplx-bridge
          ssh-key: ${{ secrets.PICO_SMPLX_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Validate version and native architecture
        working-directory: console
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const {version} = require('./package.json');
          assert.equal(process.arch, process.env.TARGET_ARCH, 'Build on the target architecture for SDL');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `console-v${version}`, 'Tag must match console/package.json version');
          }
          JS
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb squashfs-tools libasound2t64 libgbm1 libgtk-3-0t64 libnss3 libgl1
      - run: npm ci
        working-directory: console
      - run: npm run format:check
        working-directory: console
      - if: runner.os == 'macOS'
        working-directory: console
        run: |
          brew install vulkan-loader
          node -p 'require("electron")'
          prepare_software_renderer() {
            cp "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" \
              "$1/Contents/Frameworks/Electron Framework.framework/Libraries/libvulkan.dylib"
          }
          prepare_software_renderer node_modules/electron/dist/Electron.app
          npm test
          npm run make:mac
          console_app="out/Bello Mini Console-darwin-$(node -p process.arch)/Bello Mini Console.app"
          codesign --verify --deep --strict "$console_app"
          codesign -dv --verbose=2 "$console_app" 2>&1 | grep -Fx 'Identifier=kr.motomind.bello-mini-console'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$console_app/Contents/Info.plist"
          stock_uuid=$(dwarfdump --uuid node_modules/electron/dist/Electron.app/Contents/MacOS/Electron | awk '{print $2}')
          app_uuid=$(dwarfdump --uuid "$console_app/Contents/MacOS/bello-mini-console" | awk '{print $2}')
          test -n "$app_uuid" && test "$app_uuid" != "$stock_uuid"
          prepare_software_renderer "out/Bello Mini Console-darwin-$(node -p process.arch)/Bello Mini Console.app"
          BELLO_CONSOLE_EXECUTABLE="$PWD/out/Bello Mini Console-darwin-$(node -p process.arch)/Bello Mini Console.app/Contents/MacOS/bello-mini-console" node test/smoke.cjs
      - if: runner.os == 'Linux'
        working-directory: console
        run: |
          xvfb-run -a npm test
          npm run make:linux
          appimage=$(find "$PWD/out/make" -name '*.AppImage' -type f)
          test -n "$appimage"
          mkdir -p out/appimage-smoke
          (cd out/appimage-smoke && "$appimage" --appimage-extract)
          cmp assets/bello-face.png out/appimage-smoke/squashfs-root/.DirIcon
          grep -Fx 'Icon=bello-mini-console' out/appimage-smoke/squashfs-root/bello-mini-console.desktop
          BELLO_CONSOLE_EXECUTABLE="$PWD/out/appimage-smoke/squashfs-root/AppRun" xvfb-run -a node test/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            console/out/make/**/*.dmg
            console/out/make/**/*.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-checks-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            console/out/*.png
  release:
    name: Publish console release
    if: startsWith(github.ref, 'refs/tags/console-v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: console-*
          path: installers
      - name: Publish verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir release
          version="${GITHUB_REF_NAME#console-v}"
          for target in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            extension=AppImage
            if [[ "$target" == darwin-* ]]; then extension=dmg; fi
            mapfile -d '' files < <(find "installers/console-$target" -type f -name "*.$extension" -print0)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "release/Bello-Mini-Console-$version-$target.$extension"
          done
          (cd release && sha256sum *.dmg *.AppImage > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Bello Mini Console $version" \
            --notes-file console/RELEASE_NOTES.md release/*
