name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned dependency revisions
        id: dependencies
        run: |
          git submodule init
          echo "bello_stack=$(git rev-parse HEAD:deps/bello-stack)" >> "$GITHUB_OUTPUT"
          echo "gmr=$(git rev-parse HEAD:deps/GMR)" >> "$GITHUB_OUTPUT"
          echo "fast_sam=$(git rev-parse HEAD:deps/Fast-SAM-3D-Body)" >> "$GITHUB_OUTPUT"
          echo "smplx=$(git rev-parse HEAD:deps/pico-smplx-bridge)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Bello stack revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/bello-stack
          ref: ${{ steps.dependencies.outputs.bello_stack }}
          path: deps/bello-stack
          ssh-key: ${{ secrets.BELLO_STACK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out pinned GMR revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/GMR
          ref: ${{ steps.dependencies.outputs.gmr }}
          path: deps/GMR
          persist-credentials: false
      - name: Check out pinned Fast-SAM revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/Fast-SAM-3D-Body
          ref: ${{ steps.dependencies.outputs.fast_sam }}
          path: deps/Fast-SAM-3D-Body
          persist-credentials: false
      - name: Check out pinned SMPL-X bridge revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/pico-smplx-bridge
          ref: ${{ steps.dependencies.outputs.smplx }}
          path: deps/pico-smplx-bridge
          ssh-key: ${{ secrets.PICO_SMPLX_DEPLOY_KEY }}
          persist-credentials: false
      - name: Register dependency checkouts as pinned submodules
        run: |
          git submodule absorbgitdirs
          for submodule_path in \
            deps/bello-stack \
            deps/GMR \
            deps/Fast-SAM-3D-Body \
            deps/pico-smplx-bridge
          do
            test "$(git rev-parse "HEAD:$submodule_path")" = \
              "$(git -C "$submodule_path" rev-parse HEAD)"
          done
          git submodule status --recursive | \
            awk 'substr($0, 1, 1) != " " { bad = 1 } END { exit bad }'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --frozen
      - name: Headless render and encode smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
          uv run --no-sync python - <<'PY'
          from bello_mujoco.evaluation.software import configure_software_rendering, validate_software_renderer
          configure_software_rendering()

          from contextlib import ExitStack
          from pathlib import Path

          import mujoco

          from bello_mujoco.evaluation.render import VideoWriter

          validate_software_renderer()
          output_path = Path("/tmp/bello-render-smoke.mp4")
          model = mujoco.MjModel.from_xml_string(
              '<mujoco><visual><global offwidth="64" offheight="64"/></visual>'
              '<worldbody><geom type="sphere" size="0.1"/></worldbody></mujoco>'
          )
          data = mujoco.MjData(model)
          mujoco.mj_forward(model, data)
          with ExitStack() as resources:
              renderer = mujoco.Renderer(model, width=64, height=64)
              resources.callback(renderer.close)
              renderer.update_scene(data)
              frame = renderer.render()
              writer = VideoWriter(output_path, width=64, height=64, fps=1)
              resources.callback(writer.close)
              writer.append_data(frame)
          assert frame.shape == (64, 64, 3)
          assert frame.max() > frame.min()
          assert output_path.is_file()
          PY
      - name: Build wheel
        run: uv build --wheel
      - name: Wheel licensing
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python - "$wheel_path" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as wheel:
              names = set(wheel.namelist())
              license_names = [
                  name for name in names if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert len(license_names) == 1
              assert wheel.read(license_names[0]).decode().startswith("Proprietary")
          PY
      - name: Reclaim dependency cache space
        run: uv cache clean
      - run: uv run --no-sync python -m compileall -q src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync bash scripts/protobuf.sh --check
      - name: CPU tests
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          UV_NO_SYNC: "1"
        run: bash scripts/test.sh
