name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv build --wheel
      - name: Installed wheel smoke test
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python - "$wheel_path" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as wheel:
              names = set(wheel.namelist())
          assert "bello_mujoco/descriptions/bello/full_body/urdf/bello_full_body.urdf" in names
          assert "bello_mujoco/descriptions/bello/hardware.yaml" not in names
          assert "bello_mujoco/descriptions/robstride/models.yaml" not in names
          assert not any(name.startswith("bello_hardware/") for name in names)
          PY
          uv run --isolated --no-project --with "$wheel_path" python -c \
            'from bello_mujoco.assets_pipeline.prepare import AssetPrepConfig, asset_config_hash; print(asset_config_hash(AssetPrepConfig()))'
      - run: uv run --no-sync python -m compileall -q src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync bash scripts/protobuf.sh --check
      - name: CPU tests
        env:
          JAX_PLATFORMS: cpu
          MUJOCO_GL: egl
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync pytest -q -m "not integration" tests
