name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned dependency revisions
        id: dependencies
        run: |
          git submodule init
          echo "bello_stack=$(git rev-parse HEAD:deps/bello-stack)" >> "$GITHUB_OUTPUT"
          echo "gmr=$(git rev-parse HEAD:deps/GMR)" >> "$GITHUB_OUTPUT"
          echo "fast_sam=$(git rev-parse HEAD:deps/Fast-SAM-3D-Body)" >> "$GITHUB_OUTPUT"
          echo "rtmw=$(git rev-parse HEAD:deps/RTMW-SMPLX-Teleop)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Bello stack revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/bello-stack
          ref: ${{ steps.dependencies.outputs.bello_stack }}
          path: deps/bello-stack
          ssh-key: ${{ secrets.BELLO_STACK_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out pinned GMR revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/GMR
          ref: ${{ steps.dependencies.outputs.gmr }}
          path: deps/GMR
          persist-credentials: false
      - name: Check out pinned Fast-SAM revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/Fast-SAM-3D-Body
          ref: ${{ steps.dependencies.outputs.fast_sam }}
          path: deps/Fast-SAM-3D-Body
          persist-credentials: false
      - name: Check out pinned RTMW revision
        uses: actions/checkout@v6
        with:
          repository: MotomindKR/RTMW-SMPLX-Teleop
          ref: ${{ steps.dependencies.outputs.rtmw }}
          path: deps/RTMW-SMPLX-Teleop
          ssh-key: ${{ secrets.RTMW_DEPLOY_KEY }}
          persist-credentials: false
      - name: Register dependency checkouts as pinned submodules
        run: |
          git submodule absorbgitdirs
          for submodule_path in \
            deps/bello-stack \
            deps/GMR \
            deps/Fast-SAM-3D-Body \
            deps/RTMW-SMPLX-Teleop
          do
            test "$(git rev-parse "HEAD:$submodule_path")" = \
              "$(git -C "$submodule_path" rev-parse HEAD)"
          done
          git submodule status --recursive | \
            awk 'substr($0, 1, 1) != " " { bad = 1 } END { exit bad }'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --frozen
      - name: Build wheel
        run: uv build --wheel
      - name: Installed wheel smoke test
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python - "$wheel_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from posixpath import dirname, join, normpath
          from zipfile import ZipFile

          urdf_names = (
              (
                  "bello_mujoco/descriptions/bello/urdf/"
                  "bello.urdf"
              ),
              (
                  "bello_mujoco/descriptions/bello_mini/urdf/"
                  "bello_mini.urdf"
              ),
          )
          with ZipFile(sys.argv[1]) as wheel:
              names = set(wheel.namelist())
              for urdf_name in urdf_names:
                  assert urdf_name in names
                  urdf = ET.fromstring(wheel.read(urdf_name))
                  mesh_names = {
                      normpath(join(dirname(urdf_name), mesh.attrib["filename"]))
                      for mesh in urdf.iter("mesh")
                  }
                  missing = sorted(mesh_names - names)
                  assert not missing, (
                      f"wheel is missing meshes for {urdf_name}: {missing}"
                  )
              license_names = [
                  name for name in names if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert len(license_names) == 1
              assert wheel.read(license_names[0]).decode().startswith("Proprietary")
              assert "bello_mujoco/descriptions/bello/hardware.yaml" not in names
              assert "bello_mujoco/descriptions/robstride/models.yaml" not in names
              assert not any(name.startswith("bello_hardware/") for name in names)
          PY
          uv run --isolated --no-project --with "$wheel_path" python - "$RUNNER_TEMP/wheel-assets" <<'PY'
          import sys
          from pathlib import Path

          import mujoco

          from bello_mujoco.assets_pipeline.prepare import AssetPrepConfig, prepare_asset

          for asset in ("bello", "bello_mini"):
              prepared = prepare_asset(
                  AssetPrepConfig(
                      asset=asset,
                      output_root=Path(sys.argv[1]),
                      mesh_face_budget=50,
                      visual_mesh_face_budget=50,
                  )
              )
              mujoco.MjModel.from_xml_path(str(prepared.mjcf_path))
              mujoco.MjModel.from_xml_path(str(prepared.viewer_mjcf_path))
          PY
      - name: Reclaim dependency cache space
        run: uv cache clean
      - run: uv run --no-sync python -m compileall -q src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync bash scripts/protobuf.sh --check
      - name: CPU tests
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --no-sync pytest -q -m "not integration" tests
