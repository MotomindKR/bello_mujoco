# Foot-distance-only pipeline diagnostic. Run with:
# uv run bello-train-ppo --config-dir "$PWD/experiments/train" --config-name foot_distance
defaults:
  - standing
  - _self_

config:
  ent_coef: 0.03
  policy:
    init_log_std: 1.8
    max_log_std: 1.8

reward_config:
  track_lin_vel_xy:
    enabled: false
  track_ang_vel_z:
    enabled: false
  alive:
    enabled: false
  lin_vel_z:
    enabled: false
  ang_vel_xy:
    enabled: false
  flat_orientation:
    enabled: false
  base_height:
    enabled: false
  joint_vel:
    enabled: false
  joint_acc:
    enabled: false
  action_rate:
    enabled: false
  energy:
    enabled: false
  torque:
    enabled: false
  joint_limit:
    enabled: false
  hold_joint_deviation:
    enabled: false
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_distance:
    enabled: true
    weight: 1.0
  foot_slip:
    enabled: false
  foot_clearance:
    enabled: false
  gait_contact:
    enabled: false
  feet_air_time:
    enabled: false
  undesired_contact:
    enabled: false
  self_collision:
    enabled: false
  termination:
    enabled: false

done_config:
  # Keep post-fall states in the rollout for this pipeline diagnostic.
  base_height:
    enabled: false
  bad_orientation:
    enabled: false

checkpoint_config:
  name: foot_distance_high_exploration_seed0

wandb_config:
  enabled: true
  run_name: foot_distance_high_exploration_seed0
  tags: [foot-distance, pipeline-test, high-exploration-x10, rtx5090, full-body, mesh-collision]

video_config:
  enabled: true
  filename_prefix: foot_distance_high_exploration
