# Berkeley locomotion control retaining standing penalties without domain randomization.
defaults:
  - locomotion_berkeley
  - _self_

env_config:
  terrain:
    mode: plane
    seed: 0
    hfield_resolution: 65
    hfield_amplitude: 0.04
    hfield_base_thickness: 0.01
    hfield_frequency: 2.5
    slope_angle_range: [0.0, 0.0]
  model_randomization:
    enabled: false
    seed: 0
    joint_origin_range: [0.0, 0.0]
    joint_angle_offset_range: [0.0, 0.0]
    joint_inertia_scale_range: [1.0, 1.0]

checkpoint_config:
  name: locomotion_berkeley_standing_only_seed0
  wandb_artifact_name: locomotion_berkeley_standing_only_seed0

wandb_config:
  run_name: locomotion_berkeley_standing_only_seed0
  tags:
    - locomotion
    - berkeley-humanoid-recipe
    - standing-penalties-only
    - no-domain-randomization
    - plane-terrain
    - box-collision
    - sphere-hands
