# Clean locomotion with only Isaac's positive-biped air-time reward added.
defaults:
  - locomotion_clean
  - _self_

reward_config:
  feet_air_time:
    enabled: true
    weight: 0.25
    max_duration: 0.40
    command_speed_threshold: 0.10

checkpoint_config:
  name: locomotion_clean_air_time_seed0

wandb_config:
  group: locomotion-clean-feet-ablation
  run_name: locomotion_clean_air_time_seed0
  tags:
    - locomotion
    - clean-reward-ablation
    - biped-air-time-only
    - isaac-g1-inspired

video_config:
  filename_prefix: locomotion_clean_air_time
