# Locomotion recipe matching bello_stack's 25-motor sphere-hand hardware inventory.
defaults:
  - locomotion
  - _self_

asset_config:
  joint_availability:
    waist_yaw: true
    waist_roll: false
    waist_pitch: false
    neck_yaw: false
    head_pitch: false

config:
  # Preserve credit across the roughly 1.4-second moving-to-standing failure.
  gamma: 0.995
  gae_lambda: 0.98

command_config:
  standing_probability: 0.10

reward_config:
  foot_phase:
    weight: 0.25
  joint_target_rate:
    weight: -1.0e-5
  touchdown_velocity:
    weight: -0.25
    height_threshold: 0.05
    command_speed_threshold: 0.10
  termination:
    weight: -10.0

checkpoint_config:
  name: hardware_locomotion_seed0
  wandb_artifact_name: hardware_locomotion_seed0

wandb_config:
  group: hardware-locomotion
  run_name: hardware_locomotion_seed0
  tags: [locomotion, hardware, sphere-hands, fixed-waist, fixed-head, stop-credit-ablation]

video_config:
  filename_prefix: hardware_locomotion
  command: [0.0, 0.5, 0.0]
  steps: 1000
