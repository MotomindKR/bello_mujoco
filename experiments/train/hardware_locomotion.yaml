# Locomotion recipe matching bello_stack's 25-motor sphere-hand hardware inventory.
defaults:
  - locomotion
  - _self_

asset_config:
  target_total_mass_kg: 60.0
  joint_availability:
    waist_yaw: true
    waist_roll: false
    waist_pitch: false
    neck_yaw: false
    head_pitch: false

config:
  # At 50 Hz, the base locomotion discount gives too little credit to actions
  # that cause a slow standing fall one or two seconds later.
  gamma: 0.995
  gae_lambda: 0.98

checkpoint_config:
  name: hardware_locomotion_seed0
  wandb_artifact_name: hardware_locomotion_seed0

wandb_config:
  group: hardware-locomotion
  run_name: hardware_locomotion_seed0
  tags: [locomotion, hardware, sphere-hands, fixed-waist, fixed-head]

video_config:
  filename_prefix: hardware_locomotion
  command: [0.0, 0.0, 0.0]
  steps: 500
