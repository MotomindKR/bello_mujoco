# Air-time locomotion with anti-tremble rewards and conservative PPO updates.
defaults:
  - locomotion_clean_air_time
  - _self_

config:
  learning_rate: 0.00005
  schedule: linear
  target_kl: 0.015
  max_grad_norm: 0.5

reward_config:
  joint_acc:
    enabled: true
    weight: -0.000001
  action_rate:
    enabled: true
    weight: -0.05
  feet_air_time:
    enabled: true
    weight: 0.50
    max_duration: 0.40
    command_speed_threshold: 0.10

checkpoint_config:
  name: locomotion_clean_air_time_smooth_seed0

wandb_config:
  group: locomotion-clean-feet-ablation
  run_name: locomotion_clean_air_time_smooth_seed0
  tags:
    - locomotion
    - clean-reward-ablation
    - biped-air-time
    - anti-tremble
    - bounded-policy-actions

video_config:
  filename_prefix: locomotion_clean_air_time_smooth
