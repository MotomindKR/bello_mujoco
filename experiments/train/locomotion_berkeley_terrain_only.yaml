# Standing-only Berkeley control plus a level rough heightfield.
defaults:
  - locomotion_berkeley_standing_only
  - _self_

config:
  total_timesteps: 200000000

env_config:
  terrain:
    mode: rough
    seed: 0
    hfield_resolution: 65
    hfield_amplitude: 0.015
    hfield_base_thickness: 0.01
    hfield_frequency: 5.0
    slope_angle_range: [0.0, 0.0]

wandb_config:
  tags:
    - locomotion
    - berkeley-randomization-ablation
    - terrain-only
    - standing-penalties
