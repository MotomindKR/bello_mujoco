# Bello morphology port of MuJoCo Playground's Berkeley Humanoid recipe.
# The gait clock, reset distribution, command distribution, and PPO horizon
# follow the upstream baseline. Environment count, action scales, and explicit
# joint/action safety margins are adapted to Bello.
defaults:
  - locomotion_clean
  - _self_

asset_config:
  collision_mode: box
  end_effector_sphere_mode: both

config:
  total_timesteps: 150000000
  num_envs: 2048
  num_steps: 20
  update_epochs: 4
  num_minibatches: 32
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  min_learning_rate: 0.00001
  max_learning_rate: 0.0003
  adaptive_lr_factor: 1.5
  gamma: 0.97
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 1.0
  target_kl: 0.03
  normalize_value: true
  policy:
    hidden_dims: [512, 256, 128]
    activation: swish
    init_log_std: 0.0
    max_log_std: 0.0
    obs_stack_size: 1
    action_distribution: tanh_gaussian
    action_limit: 1.0
    normalize_observations: true
    observation_norm_eps: 0.00000001

env_config:
  max_episode_steps: 1000
  action_clip: 1.0
  root_link: pelvis_link
  spawn:
    root_xy_range: [-0.5, 0.5]
    root_yaw_range: [-3.14159265, 3.14159265]
    joint_pos_noise: [0.0, 0.0]
    joint_pos_scale_range: [0.5, 1.5]
    joint_vel_range: [0.0, 0.0]
    root_vel_range: [-0.5, 0.5]
    stagger_initial_step_count: false
  gait:
    cycle_time: 0.7272727
    command_speed_frequency_gain: 0.0
    min_frequency: 1.25
    max_frequency: 1.50
    duty_factor: 0.5
    phase_offsets: [0.0, 0.5]
    standing_command_threshold: 0.0
    randomize_frequency: true
    frequency_range: [1.25, 1.50]
    foot_height: 0.10
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: true
    interval_seconds: 5.0
    lin_vel_x: [-2.0, 2.0]
    lin_vel_y: [-2.0, 2.0]
  observation:
    joint_mode: policy
    base_lin_vel: true
    base_ang_vel: true
    projected_gravity: true
    base_height: false
    gait_phase: false
    foot_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: false
    last_action: true
    scale:
      base_lin_vel: 1.0
      base_ang_vel: 1.0
      projected_gravity: 1.0
      foot_phase: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 1.0
      last_action: 1.0
    noise:
      enabled: true
      base_lin_vel: [-0.1, 0.1]
      base_ang_vel: [-0.2, 0.2]
      projected_gravity: [-0.05, 0.05]
      foot_phase: [0.0, 0.0]
      command: [0.0, 0.0]
      joint_pos: [-0.05, 0.05]
      joint_vel: [-1.5, 1.5]
      last_action: [0.0, 0.0]
  critic_observation:
    joint_mode: policy
    base_lin_vel: true
    base_ang_vel: true
    projected_gravity: true
    base_height: true
    gait_phase: false
    foot_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: true
    last_action: true
    noise:
      enabled: false

command_config:
  enabled: true
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.0, 1.0]
  ang_vel_yaw: [-1.0, 1.0]
  standing_probability: 0.10
  resample_seconds: 10.0
  curriculum:
    enabled: false

reward_config:
  track_lin_vel_xy:
    enabled: true
    weight: 1.0
    sigma: 0.5
    link: pelvis_link
    frame_link: pelvis_link
  track_ang_vel_z:
    enabled: true
    weight: 0.5
    sigma: 0.5
    link: pelvis_link
  alive:
    enabled: false
  lin_vel_z:
    enabled: false
  ang_vel_xy:
    enabled: true
    weight: -0.15
    link: torso_link
  flat_orientation:
    enabled: true
    weight: -1.0
    link: torso_link
  base_height:
    enabled: false
  joint_vel:
    enabled: false
  joint_acc:
    enabled: false
  action_rate:
    enabled: true
    weight: -0.01
  action_limit:
    enabled: true
    weight: -1.0
    soft_limit_ratio: 0.8
  energy:
    enabled: false
  torque:
    enabled: false
  torque_l1:
    enabled: true
    weight: -0.000025
  joint_pose:
    enabled: true
    weight: -1.0
  hip_deviation:
    enabled: true
    weight: -0.25
    lateral_command_index: 0
    lateral_command_threshold: 0.1
  knee_deviation:
    enabled: true
    weight: -0.1
  joint_limit:
    enabled: true
    weight: -1.0
    soft_limit_factor: 0.9
  invalid_action:
    enabled: false
  hold_joint_deviation:
    enabled: false
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_slip:
    enabled: true
    weight: -0.25
    angular_speed_scale: 0.0
  foot_clearance:
    enabled: false
  swing_foot_velocity:
    enabled: false
  foot_distance:
    enabled: false
  stance_width:
    enabled: false
  gait_contact:
    enabled: false
  contact_timing:
    enabled: false
  feet_air_time:
    enabled: false
  touchdown_air_time:
    enabled: true
    weight: 2.0
    min_air_time: 0.2
    max_air_time: 0.5
    command_speed_threshold: 0.1
  foot_phase:
    enabled: true
    weight: 1.0
    sigma: 0.01
  standing_foot_vel:
    enabled: false
  standing_foot_air_time:
    enabled: false
  undesired_contact:
    enabled: false
  self_collision:
    enabled: false
  termination:
    enabled: true
    weight: -1.0
  clip_negative_total: true
  scale_termination_by_timestep: true

done_config:
  base_height:
    enabled: false
  bad_orientation:
    enabled: true
    limit_angle: 1.57079633
    link: torso_link

checkpoint_config:
  enabled: true
  name: locomotion_berkeley_seed0
  upload_wandb_artifact: true
  wandb_artifact_name: locomotion_berkeley_seed0

wandb_config:
  enabled: true
  group: locomotion-berkeley-port
  run_name: locomotion_berkeley_seed0
  tags:
    - locomotion
    - berkeley-humanoid-recipe
    - baseline-port
    - box-collision
    - sphere-hands

video_config:
  enabled: true
  every_updates: 512
  render_initial: true
  render_final: true
  filename_prefix: locomotion_berkeley
  simulation_backend: mujoco
  command: [0.0, 0.5, 0.0]
  steps: 1000
  stop_on_done: true
  stochastic_actions: false

warp:
  contact_budget_per_env: 40
  njmax: 2048
