# Easy fixed-command locomotion diagnostic. Run with:
# uv run bello-train-ppo --config-dir "$PWD/experiments/train" --config-name locomotion_easy
defaults:
  - locomotion
  - _self_

asset_config:
  collision_mode: box

config:
  total_timesteps: 50000000
  num_envs: 2048
  num_steps: 24
  learning_rate: 0.0001
  target_kl: null
  ent_coef: 0.01
  policy:
    hidden_dims: [512, 256, 128]
    activation: elu
    init_log_std: -1.5
    max_log_std: -0.5
    obs_stack_size: 5

env_config:
  max_episode_steps: 1000
  root_link: torso_link
  spawn:
    root_xy_range: [0.0, 0.0]
    root_yaw_range: [0.0, 0.0]
    joint_pos_noise: [0.0, 0.0]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: false
  observation:
    joint_mode: policy
    base_lin_vel: false
    base_height: false
    gait_phase: true
    command: true
    actuator_force: false
    scale:
      base_ang_vel: 0.2
      joint_vel: 0.05
    noise:
      enabled: false
  critic_observation:
    joint_mode: policy
    base_lin_vel: true
    base_ang_vel: true
    projected_gravity: true
    base_height: false
    gait_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: false
    last_action: true
    scale:
      base_lin_vel: 1.0
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      gait_phase: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 1.0
      last_action: 1.0
    noise:
      enabled: false

command_config:
  enabled: true
  lin_vel_x: [0.0, 0.0]
  lin_vel_y: [0.50, 0.50]
  ang_vel_yaw: [0.0, 0.0]
  standing_probability: 0.0
  resample_seconds: 1000.0
  curriculum:
    enabled: false

reward_config:
  track_lin_vel_xy:
    enabled: true
    weight: 5.0
    sigma: 0.25
    link: pelvis_link
    frame_link: pelvis_link
  track_ang_vel_z:
    enabled: true
    weight: 0.5
    sigma: 0.25
    link: pelvis_link
  alive:
    enabled: true
    weight: 0.10
  lin_vel_z:
    enabled: true
    weight: -1.0
    link: torso_link
  ang_vel_xy:
    enabled: true
    weight: -0.05
    link: torso_link
  flat_orientation:
    enabled: true
    weight: -2.0
    link: torso_link
  base_height:
    enabled: true
    weight: -3.0
    link: torso_link
    target: 1.03
  joint_vel:
    enabled: true
    weight: -0.0005
  joint_acc:
    enabled: true
    weight: -0.0000001
  action_rate:
    enabled: true
    weight: -0.01
  energy:
    enabled: true
    weight: -0.00001
  torque:
    enabled: false
  joint_limit:
    enabled: false
    weight: -20.0
  invalid_action:
    enabled: true
    weight: -1.0
  hold_joint_deviation:
    enabled: true
    weight: -0.05
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_distance:
    enabled: false
  foot_slip:
    enabled: true
    weight: -0.5
    angular_speed_scale: 0.05
  foot_clearance:
    enabled: true
    weight: 0.5
    target: 0.08
    std: 0.05
    tanh_mult: 2.0
    command_speed_threshold: 0.05
  swing_foot_velocity:
    enabled: true
    weight: 0.5
    link: pelvis_link
    std: 0.25
    max_target_speed: 2.0
    command_speed_threshold: 0.10
  gait_contact:
    enabled: true
    weight: 0.5
    command_speed_threshold: 0.10
  feet_air_time:
    enabled: true
    weight: 0.5
    min_air_time: 0.10
    max_air_time: 0.40
    command_speed_threshold: 0.05
  undesired_contact:
    enabled: true
    weight: -0.5
  self_collision:
    enabled: true
    weight: -0.5
  termination:
    enabled: true
    weight: -2.0

done_config:
  base_height:
    enabled: true
    min_height: 0.20
    link: bello_root
  bad_orientation:
    enabled: true
    limit_angle: 1.00
    link: bello_root

checkpoint_config:
  enabled: true
  name: locomotion_easy_fixed_forward_seed0

wandb_config:
  enabled: true
  run_name: locomotion_easy_fixed_forward_seed0
  tags:
    - locomotion
    - easy-diagnostic
    - fixed-forward-command
    - no-curriculum
    - no-random-push
    - no-observation-noise
    - no-gait-contact
    - stochastic-mjx-video
    - force-limited-actuators
    - full-body
    - box-collision

video_config:
  enabled: true
  filename_prefix: locomotion_easy_fixed_forward
  simulation_backend: mujoco
  command: [0.0, 0.5, 0.0]
  steps: 600
  stop_on_done: false
  stochastic_actions: true
  action_seed: 0

warp:
  contact_budget_per_env: 40
  njmax: 512
