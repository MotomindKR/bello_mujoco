# Command-conditioned locomotion recipe. Run with:
# uv run bello-train-ppo --config-dir "$PWD/experiments/train" --config-name locomotion_hard
defaults:
  - locomotion_easy
  - _self_

config:
  total_timesteps: 600000000
  num_envs: 2048
  num_steps: 24
  target_kl: 0.02
  ent_coef: 0.01

env_config:
  spawn:
    root_xy_range: [-0.10, 0.10]
    root_yaw_range: [-0.30, 0.30]
    joint_pos_noise: [-0.02, 0.02]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  random_push:
    enabled: true
    interval_seconds: 8.0
    lin_vel_x: [-0.20, 0.20]
    lin_vel_y: [-0.20, 0.20]
  observation:
    command: true
    gait_phase: true
    noise:
      enabled: true
      base_ang_vel: [-0.10, 0.10]
      projected_gravity: [-0.02, 0.02]
      joint_pos: [-0.005, 0.005]
      joint_vel: [-0.50, 0.50]
  critic_observation:
    command: true
    gait_phase: true
    noise:
      enabled: false

command_config:
  enabled: true
  lin_vel_x: [-0.05, 0.05]
  lin_vel_y: [0.25, 0.55]
  ang_vel_yaw: [-0.05, 0.05]
  standing_probability: 0.10
  resample_seconds: 6.0
  curriculum:
    enabled: true
    limit_lin_vel_x: [-0.25, 0.25]
    limit_lin_vel_y: [0.10, 0.85]
    limit_ang_vel_yaw: [-0.25, 0.25]
    expand_ang_vel_yaw: true
    increment: 0.05
    success_threshold: 0.75

reward_config:
  torque:
    enabled: true
    weight: -0.000005
  termination:
    enabled: true
    weight: -2.0

checkpoint_config:
  enabled: true
  name: locomotion_hard_seed0

wandb_config:
  enabled: true
  run_name: locomotion_hard_seed0
  tags:
    - locomotion
    - command-conditioned
    - adaptive-command-curriculum
    - random-pushes
    - observation-noise
    - reset-randomization
    - target-kl
    - force-limited-actuators
    - full-body
    - box-collision

video_config:
  enabled: true
  filename_prefix: locomotion_hard
  simulation_backend: mujoco
  command: [0.0, 0.5, 0.0]
  steps: 600
  stop_on_done: false
  stochastic_actions: true
  action_seed: 0
