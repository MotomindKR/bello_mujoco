      waist_yaw_joint:
        mode: policy
        action_scale: 0.25
        soft_limit: [-0.45, 0.45]
        gains: [180.0, 12.0]
      waist_roll_joint:
        mode: hold
        gains: [240.0, 20.0]
      waist_pitch_joint:
        mode: hold
        gains: [240.0, 20.0]
      neck_yaw_joint:
        mode: hold
        gains: [5.5, 0.5]
      head_pitch_joint:
        mode: hold
        gains: [5.5, 0.5]
      right_shoulder_pitch_joint:
        mode: hold
        gains: [70.0, 2.0]
      right_shoulder_roll_joint:
