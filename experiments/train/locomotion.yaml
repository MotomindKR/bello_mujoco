# Unitree-aligned locomotion recipe bootstrapped from the stabilized standing setup.
# This intentionally inherits only the base training defaults, not standing.yaml.
# Run with:
# uv run bello-train-ppo --config-dir "$PWD/experiments/train" --config-name locomotion
defaults:
  - default
  - _self_

dry_run: false

asset_config:
  end_effector_sphere_mode: both
  actuator_config:
    joints:
      left_hip_pitch_joint:
        mode: policy
        default_pos: -0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
      right_hip_pitch_joint:
        mode: policy
        default_pos: 0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
      left_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      right_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      left_hip_yaw_joint:
        mode: policy
        default_pos: 0.125
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      right_hip_yaw_joint:
        mode: policy
        default_pos: -0.125
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      left_knee_joint:
        mode: policy
        default_pos: 0.45
        action_scale: 0.45
        soft_limit: [0.10472, 1.98968]
        gains: [220.0, 6.0]
      right_knee_joint:
        mode: policy
        default_pos: 0.45
        action_scale: 0.45
        soft_limit: [0.10472, 1.98968]
        gains: [220.0, 6.0]
      left_ankle_pitch_joint:
        mode: policy
        default_pos: 0.30
        action_scale: 0.20
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
      right_ankle_pitch_joint:
        mode: policy
        default_pos: 0.30
        action_scale: 0.20
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
      left_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.05
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
      right_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.05
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
      waist_yaw_joint:
        mode: policy
        action_scale: 0.25
        soft_limit: [-0.45, 0.45]
        gains: [180.0, 12.0]
      waist_roll_joint:
        mode: hold
        gains: [240.0, 20.0]
      waist_pitch_joint:
        mode: hold
        gains: [240.0, 20.0]
      neck_yaw_joint:
        mode: hold
        gains: [5.5, 0.5]
      head_pitch_joint:
        mode: hold
        gains: [5.5, 0.5]
      right_shoulder_pitch_joint:
        mode: hold
        gains: [70.0, 2.0]
      right_shoulder_roll_joint:
        mode: hold
        gains: [70.0, 2.0]
      right_shoulder_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      right_elbow_pitch_joint:
        mode: hold
        gains: [40.0, 2.0]
      right_elbow_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      right_wrist_pitch_joint:
        mode: hold
        gains: [10.0, 1.0]
      right_wrist_yaw_joint:
        mode: hold
        gains: [10.0, 1.0]
      left_shoulder_pitch_joint:
        mode: hold
        gains: [70.0, 2.0]
      left_shoulder_roll_joint:
        mode: hold
        gains: [70.0, 2.0]
      left_shoulder_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      left_elbow_pitch_joint:
        mode: hold
        gains: [40.0, 2.0]
      left_elbow_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      left_wrist_pitch_joint:
        mode: hold
        gains: [10.0, 1.0]
      left_wrist_yaw_joint:
        mode: hold
        gains: [10.0, 1.0]
      right_finger_right_slide_joint:
        mode: hold
        gains: [100.0, 5.0]
      right_finger_left_slide_joint:
        mode: hold
        gains: [100.0, 5.0]
      left_finger_right_slide_joint:
        mode: hold
        gains: [100.0, 5.0]
      left_finger_left_slide_joint:
        mode: hold
        gains: [100.0, 5.0]

config:
  total_timesteps: 4915200000
  num_envs: 4096
  num_steps: 24
  policy:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_stack_size: 5

env_config:
  max_episode_steps: 1000
  root_link: torso_link
  contact:
    foot_contact_on_seconds: 0.04
    foot_contact_off_seconds: 0.04
  random_push:
    enabled: true
    interval_seconds: 5.0
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  observation:
    joint_mode: policy
    base_lin_vel: false
    base_height: false
    gait_phase: false
    command: true
    actuator_force: false
    scale:
      base_ang_vel: 0.2
      joint_vel: 0.05
    noise:
      enabled: true
      base_ang_vel: [-0.2, 0.2]
      projected_gravity: [-0.05, 0.05]
      joint_pos: [-0.01, 0.01]
      joint_vel: [-1.5, 1.5]

command_config:
  enabled: true
  lin_vel_x: [-0.1, 0.1]
  lin_vel_y: [-0.1, 0.1]
  ang_vel_yaw: [-0.1, 0.1]
  standing_probability: 0.02
  resample_seconds: 10.0
  curriculum:
    enabled: true
    limit_lin_vel_x: [-0.5, 1.0]
    limit_lin_vel_y: [-0.3, 0.3]
    limit_ang_vel_yaw: [-0.2, 0.2]
    expand_ang_vel_yaw: false
    increment: 0.1
    success_threshold: 0.8

reward_config:
  track_lin_vel_xy:
    enabled: true
    weight: 1.0
    sigma: 0.25
  track_ang_vel_z:
    enabled: true
    weight: 0.5
    sigma: 0.25
  alive:
    enabled: true
    weight: 0.15
  lin_vel_z:
    enabled: true
    weight: -2.0
  ang_vel_xy:
    enabled: true
    weight: -0.05
  flat_orientation:
    enabled: true
    weight: -5.0
  base_height:
    enabled: true
    weight: -10.0
    target: 0.86
  joint_vel:
    enabled: true
    weight: -0.001
  joint_acc:
    enabled: true
    weight: -0.00000025
  action_rate:
    enabled: true
    weight: -0.05
  energy:
    enabled: true
    weight: -0.00002
  torque:
    enabled: false
    weight: -0.00001
  joint_limit:
    enabled: true
    weight: -5.0
  hold_joint_deviation:
    enabled: true
    weight: -0.1
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_distance:
    enabled: false
  foot_slip:
    enabled: true
    weight: -0.2
  foot_clearance:
    enabled: true
    weight: 1.0
    target: 0.10
    std: 0.05
    tanh_mult: 2.0
  gait_contact:
    enabled: true
    weight: 0.5
    command_speed_threshold: 0.10
  feet_air_time:
    enabled: false
    weight: 0.2
    min_air_time: 0.15
    max_air_time: 0.60
    command_speed_threshold: 0.05
  undesired_contact:
    enabled: true
    weight: -1.0
  termination:
    enabled: false
    weight: -0.5

done_config:
  base_height:
    enabled: true
    min_height: 0.55
  roll_pitch:
    enabled: true
    max_abs_roll: 1.35
    max_abs_pitch: 1.35

checkpoint_config:
  enabled: true
  name: locomotion_unitree_aligned_seed0

wandb_config:
  enabled: true
  run_name: locomotion_unitree_aligned_seed0
  tags:
    - locomotion
    - standing-bootstrap
    - native-locomotion-reward
    - gait-contact
    - command-curriculum
    - random-pushes
    - observation-noise
    - unitree-rollout-horizon
    - unitree-policy-history
    - unitree-policy-mlp
    - value-normalized
    - full-body
    - mesh-collision
    - sphere-end-effectors

video_config:
  enabled: true
  filename_prefix: locomotion_unitree_aligned
  command: [0.25, 0.0, 0.0]
  steps: 600
  stop_on_done: false

warp:
  contact_budget_per_env: 40
