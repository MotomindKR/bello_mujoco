        mode: hold
        gains: [70.0, 2.0]
      left_shoulder_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      left_elbow_pitch_joint:
        mode: hold
        gains: [40.0, 2.0]
      left_elbow_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
      left_wrist_pitch_joint:
