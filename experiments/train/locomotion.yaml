config:
  total_timesteps: 98304000
  num_envs: 4096
  num_steps: 150

env_config:
  max_episode_steps: 512
  root_link: torso_link
  contact:
    foot_contact_on_seconds: 0.04
    foot_contact_off_seconds: 0.04
  observation:
    joint_mode: policy
    base_lin_vel: true
    base_height: true
    gait_phase: true
    command: true
    actuator_force: false

command_config:
  enabled: true
  lin_vel_x: [0.0, 0.4]
  lin_vel_y: [-0.05, 0.05]
  ang_vel_yaw: [-0.2, 0.2]
  standing_probability: 0.2
  resample_seconds: 6.0

reward_config:
  track_lin_vel_xy:
    enabled: true
    weight: 1.5
    sigma: 0.25
  track_ang_vel_z:
    enabled: true
    weight: 0.75
    sigma: 0.25
  alive:
    enabled: true
    weight: 0.125
  lin_vel_z:
    enabled: true
    weight: -0.5
  ang_vel_xy:
    enabled: true
    weight: -0.1
  flat_orientation:
    enabled: true
    weight: -1.0
  base_height:
    enabled: true
    weight: -2.0
    target: 0.86
  joint_vel:
    enabled: true
    weight: -0.0005
  action_rate:
    enabled: true
    weight: -0.01
  energy:
    enabled: false
  torque:
    enabled: true
    weight: -0.00001
  joint_limit:
    enabled: true
    weight: -2.0
  hold_joint_deviation:
    enabled: false
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_distance:
    enabled: false
  foot_slip:
    enabled: true
    weight: -0.05
  foot_clearance:
    enabled: true
    weight: -1.0
    target: 0.08
  gait_contact:
    enabled: false
    weight: -0.2
  feet_air_time:
    enabled: true
    weight: 0.2
    min_air_time: 0.15
    max_air_time: 0.60
    command_speed_threshold: 0.05
  undesired_contact:
    enabled: true
    weight: -1.0
  termination:
    enabled: true
    weight: -0.5

done_config:
  base_height:
    enabled: true
    min_height: 0.55
  roll_pitch:
    enabled: true
    max_abs_roll: 1.35
    max_abs_pitch: 1.35

checkpoint_config:
  enabled: true
  name: locomotion_standing_bootstrap_seed0

wandb_config:
  enabled: true
  run_name: locomotion_standing_bootstrap_seed0
  tags:
    - locomotion
    - standing-bootstrap
    - native-locomotion-reward
    - gait-contact
    - value-normalized
    - full-body
    - mesh-collision
    - sphere-end-effectors

video_config:
  enabled: true
  filename_prefix: locomotion_standing_bootstrap
  command: [0.25, 0.0, 0.0]
  steps: 600
  stop_on_done: false

warp:
  contact_budget_per_env: 40
