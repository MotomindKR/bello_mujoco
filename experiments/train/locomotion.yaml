config:
  total_timesteps: 4915200000
  num_envs: 4096
  num_steps: 24
  target_kl: 0.02
  ent_coef: 0.01
  policy:
    hidden_dims: [512, 256, 128]
    activation: elu
    init_log_std: 0.0
    max_log_std: 1.0
    obs_stack_size: 5

env_config:
  max_episode_steps: 1000
  root_link: torso_link
  spawn:
    root_xy_range: [-0.5, 0.5]
    root_yaw_range: [-3.14, 3.14]
    joint_pos_noise: [0.0, 0.0]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: true
    interval_seconds: 5.0
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  observation:
    joint_mode: policy
    base_lin_vel: false
    base_height: false
    gait_phase: true
    command: true
    actuator_force: false
    scale:
      base_ang_vel: 0.2
      joint_vel: 0.05
    noise:
      enabled: true
      base_ang_vel: [-0.2, 0.2]
      projected_gravity: [-0.05, 0.05]
      joint_pos: [-0.01, 0.01]
      joint_vel: [-1.5, 1.5]
  critic_observation:
    joint_mode: policy
    base_lin_vel: true
    base_ang_vel: true
    projected_gravity: true
    base_height: false
    gait_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: false
    last_action: true
    scale:
      base_lin_vel: 1.0
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      gait_phase: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 1.0
      last_action: 1.0
    noise:
      enabled: false

command_config:
  enabled: true
  lin_vel_x: [-0.1, 0.1]
  lin_vel_y: [0.15, 0.35]
  ang_vel_yaw: [-0.1, 0.1]
  standing_probability: 0.10
  resample_seconds: 10.0
  curriculum:
    enabled: true
    limit_lin_vel_x: [-0.3, 0.3]
    limit_lin_vel_y: [-0.5, 1.0]
    limit_ang_vel_yaw: [-0.2, 0.2]
    expand_ang_vel_yaw: false
    increment: 0.1
    success_threshold: 0.8

reward_config:
  track_lin_vel_xy:
    enabled: true
    weight: 3.0
    sigma: 0.25
    link: bello_root
    frame_link: bello_root
  track_ang_vel_z:
    enabled: true
    weight: 0.5
    sigma: 0.25
    link: bello_root
  alive:
    enabled: true
    weight: 0.15
  lin_vel_z:
    enabled: true
    weight: -2.0
    link: torso_link
  ang_vel_xy:
    enabled: true
    weight: -0.05
    link: torso_link
  flat_orientation:
    enabled: true
    weight: -5.0
    link: torso_link
  base_height:
    enabled: true
    weight: -10.0
    link: torso_link
    target: 1.03
  joint_vel:
    enabled: true
    weight: -0.001
  joint_acc:
    enabled: true
    weight: -0.00000025
  action_rate:
    enabled: true
    weight: -0.05
  energy:
    enabled: true
    weight: -0.00002
  torque:
    enabled: false
    weight: -0.00001
  joint_limit:
    enabled: false
    weight: -50.0
  invalid_action:
    enabled: true
    weight: -1.0
  hold_joint_deviation:
    enabled: true
    weight: -0.1
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_distance:
    enabled: false
  foot_slip:
    enabled: true
    weight: -0.2
    angular_speed_scale: 0.05
  foot_clearance:
    enabled: true
    weight: 1.0
    target: 0.10
    std: 0.05
    tanh_mult: 2.0
    command_speed_threshold: 0.05
  gait_contact:
    enabled: true
    weight: 0.5
    command_speed_threshold: 0.10
  feet_air_time:
    enabled: false
    weight: 0.2
    min_air_time: 0.15
    max_air_time: 0.60
    command_speed_threshold: 0.05
  undesired_contact:
    enabled: true
    weight: -1.0
  self_collision:
    enabled: true
    weight: -1.0
  termination:
    enabled: true
    weight: -2.0

done_config:
  base_height:
    enabled: true
    min_height: 0.20
    link: bello_root
  bad_orientation:
    enabled: true
    limit_angle: 0.80
    link: bello_root

checkpoint_config:
  enabled: true
  name: locomotion_step_entropy_safe_seed0

wandb_config:
  enabled: true
  run_name: locomotion_step_entropy_safe_seed0
  tags:
    - locomotion
    - standing-bootstrap
    - native-locomotion-reward
    - gait-contact
    - command-curriculum
    - random-pushes
    - observation-noise
    - unitree-rollout-horizon
    - unitree-policy-history
    - unitree-policy-mlp
    - value-normalized
    - forward-command-pressure
    - step-pressure
    - exploration-pressure
    - safe-entropy
    - stochastic-cpu-video
    - full-body
    - mesh-collision
    - sphere-end-effectors

video_config:
  enabled: true
  filename_prefix: locomotion_step_entropy_safe
  simulation_backend: mujoco
  command: [0.0, 0.3, 0.0]
  steps: 600
  stop_on_done: false
  stochastic_actions: true
  action_seed: 0

warp:
  contact_budget_per_env: 40
  njmax: 512
