# Conservative locomotion recipe bootstrapped from the stabilized standing setup.
# This intentionally inherits only the base training defaults, not standing.yaml.
# Run with:
# uv run bello-train-ppo --config-dir "$PWD/experiments/train" --config-name locomotion
defaults:
  - default
  - _self_

dry_run: false

asset_config:
  end_effector_sphere_mode: both
  actuator_config:
    joints:
      left_hip_pitch_joint:
        mode: policy
        default_pos: -0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
      right_hip_pitch_joint:
        mode: policy
        default_pos: 0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
      left_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      right_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      left_hip_yaw_joint:
        mode: policy
        default_pos: 0.125
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      right_hip_yaw_joint:
        mode: policy
        default_pos: -0.125
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      left_knee_joint:
        mode: policy
        default_pos: 0.45
        action_scale: 0.45
        soft_limit: [0.10472, 1.98968]
        gains: [220.0, 6.0]
      right_knee_joint:
        mode: policy
        default_pos: 0.45
        action_scale: 0.45
        soft_limit: [0.10472, 1.98968]
        gains: [220.0, 6.0]
      left_ankle_pitch_joint:
        mode: policy
        default_pos: 0.30
        action_scale: 0.20
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
      right_ankle_pitch_joint:
        mode: policy
        default_pos: 0.30
        action_scale: 0.20
        soft_limit: [-0.44506, 0.96866]
