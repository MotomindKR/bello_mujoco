# Direct-joint actuator control for a matched short baseline.
defaults:
  - locomotion_berkeley
  - _self_

config:
  total_timesteps: 200000000
  learning_rate: 0.0001
  max_learning_rate: 0.0001
  normalize_value: false

env_config:
  simulation_physics:
    foot_terrain_margin: null
    foot_terrain_solref: null
    foot_terrain_solimp: null
  terrain:
    mode: plane
    slope_angle_range: [-0.034906585, 0.034906585]
    randomize_slope_per_world: true

reward_config:
  invalid_action:
    enabled: true
    weight: -1.0

checkpoint_config:
  name: berkeley-direct-short-seed0
  wandb_artifact_name: berkeley-direct-short-seed0

wandb_config:
  group: locomotion-berkeley-differential-ablation
  run_name: berkeley-direct-short-seed0
  tags:
    - direct-joint-actuators
    - joint-space-policy
    - short-ablation
