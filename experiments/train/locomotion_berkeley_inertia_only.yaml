# Standing-only Berkeley control plus diagonal body-inertia randomization.
defaults:
  - locomotion_berkeley_standing_only
  - _self_

config:
  total_timesteps: 200000000

env_config:
  model_randomization:
    enabled: true
    seed: 0
    joint_origin_range: [0.0, 0.0]
    joint_angle_offset_range: [0.0, 0.0]
    joint_angle_offset_scope: policy
    joint_inertia_scale_range: [0.95, 1.05]

wandb_config:
  tags:
    - locomotion
    - berkeley-randomization-ablation
    - inertia-only
    - standing-penalties
