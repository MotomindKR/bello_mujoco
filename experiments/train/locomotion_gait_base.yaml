# Retained anti-tremble control: smooth PPO, positive-biped support, and stance band.
defaults:
  - locomotion_clean
  - _self_

config:
  learning_rate: 0.00005
  schedule: linear
  target_kl: 0.015
  max_grad_norm: 0.5

reward_config:
  joint_acc:
    enabled: true
    weight: -0.000001
  action_rate:
    enabled: true
    weight: -0.05
  feet_air_time:
    enabled: true
    weight: 0.50
    max_duration: 0.40
    command_speed_threshold: 0.10
  stance_width:
    enabled: true
    weight: -2.0
    link: pelvis_link
    min_width: 0.24
    max_width: 0.34
  contact_timing:
    enabled: false
    weight: -0.10
    min_air_time: 0.20
    min_contact_time: 0.30
    command_speed_threshold: 0.10

checkpoint_config:
  name: locomotion_gait_base_seed0

wandb_config:
  group: locomotion-gait-ablation
  run_name: locomotion_gait_base_seed0
  tags:
    - locomotion
    - gait-ablation
    - retained-control
    - stance-width

video_config:
  filename_prefix: locomotion_gait_base
