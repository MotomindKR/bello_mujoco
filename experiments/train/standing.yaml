        mode: hold
        gains: [240.0, 20.0]
      neck_yaw_joint:
        mode: hold
        gains: [5.5, 0.5]
      head_pitch_joint:
        mode: hold
        gains: [5.5, 0.5]
      right_shoulder_pitch_joint:
