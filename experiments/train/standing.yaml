      left_hip_pitch_joint:
        mode: policy
        default_pos: -0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
      right_hip_pitch_joint:
        mode: policy
        default_pos: 0.325
        action_scale: 0.35
        soft_limit: [-1.41372, 1.41372]
