config:
  total_timesteps: 67108864
  num_envs: 1024
  num_steps: 256
  update_epochs: 2
  num_minibatches: 4
  learning_rate: 0.0002
  anneal_lr: false
  gamma: 0.995
  clip_eps: 0.1
  ent_coef: 0.03
  policy:
    init_log_std: 1.8
    obs_stack_size: 10

env_config:
  max_episode_steps: 256
  observation:
    joint_mode: policy
    base_lin_vel: true
    base_height: true
    gait_phase: false
    command: false
    actuator_force: false

command_config:
  enabled: false
  lin_vel_x: [0.0, 0.0]
  lin_vel_y: [0.0, 0.0]
  ang_vel_yaw: [0.0, 0.0]
  standing_probability: 0.0
  resample_seconds: 4.0

reward_config:
  dm_control_stand:
    enabled: true
    weight: 1.0
    height_link: head_link
    upright_link: torso_link
    move_link: bello_root
    stand_height: 1.4
    stand_margin: 0.35
    upright_threshold: 0.9
    upright_margin: 1.9
    move_margin: 2.0
    action_margin: 5.0
  track_lin_vel_xy:
    enabled: false
  track_ang_vel_z:
    enabled: false
  alive:
    enabled: false
  lin_vel_z:
    enabled: false
  ang_vel_xy:
    enabled: false
  flat_orientation:
    enabled: false
  base_height:
    enabled: false
  joint_vel:
    enabled: false
  action_rate:
    enabled: false
  energy:
    enabled: false
  joint_limit:
    enabled: false
  hold_joint_deviation:
    enabled: false
  policy_joint_deviation:
    enabled: false
  foot_contact:
    enabled: false
  foot_slip:
    enabled: false
  foot_clearance:
    enabled: false
  gait_contact:
    enabled: false
  feet_air_time:
    enabled: false
  undesired_contact:
    enabled: false
  termination:
    enabled: true
    weight: -1.0

done_config:
  base_height:
    enabled: true
    min_height: 0.55
  roll_pitch:
    enabled: true
    max_abs_roll: 1.35
    max_abs_pitch: 1.35

checkpoint_config:
  name: standing_high_exploration_seed0

wandb_config:
  enabled: true
  run_name: standing_high_exploration_seed0
  tags:
    - standing
    - rtx5090
    - full-body
    - mesh-collision
    - sphere-end-effectors
    - high-exploration-x10

video_config:
  enabled: true
  filename_prefix: standing_high_exploration
  command: [0.0, 0.0, 0.0]
  steps: 500
  stop_on_done: false

warp:
  contact_budget_per_env: 40
