        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      right_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        action_scale: 0.25
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
      left_hip_yaw_joint:
