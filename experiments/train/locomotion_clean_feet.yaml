# Clean locomotion with the two minimal Isaac G1 foot terms combined.
defaults:
  - locomotion_clean
  - _self_

reward_config:
  foot_slip:
    enabled: true
    weight: -0.10
    angular_speed_scale: 0.05
  feet_air_time:
    enabled: true
    weight: 0.25
    max_duration: 0.40
    command_speed_threshold: 0.10

checkpoint_config:
  name: locomotion_clean_feet_seed0

wandb_config:
  group: locomotion-clean-feet-ablation
  run_name: locomotion_clean_feet_seed0
  tags:
    - locomotion
    - clean-reward-ablation
    - slip-plus-biped-air-time
    - isaac-g1-inspired

video_config:
  filename_prefix: locomotion_clean_feet
