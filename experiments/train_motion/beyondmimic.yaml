# Paper-aligned BeyondMimic tracker for fixed-waist, fixed-head Bello.
defaults:
  - default
  - _self_

dry_run: false

motion:
  directory: motions/local/lafan1_fixed_head
  sequence: walk1_subject1

config:
  total_timesteps: 2949120000  # 30,000 updates x 4,096 envs x 24 steps.
  num_envs: 4096
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.001
  schedule: adaptive
  adaptive_kl_statistic: mean
  desired_kl: 0.01
  ent_coef: 0.005
  max_grad_norm: 1.0
  normalize_observations: true
  policy:
    hidden_dims: [512, 256, 128]
    activation: elu
    init_log_std: 0.0
    obs_stack_size: 1
    action_distribution: gaussian

env_config:
  formulation: beyondmimic
  anchor_body_name: torso_link
  action_clip: 100.0
  reset:
    random_start: true
    initial_xy_range: [0.0, 0.0]
    initial_yaw_range: [0.0, 0.0]
    joint_pos_noise: [-0.1, 0.1]
    joint_vel_noise: [0.0, 0.0]
    root_position_noise: [0.05, 0.05, 0.01]
    root_rotation_noise: [0.1, 0.1, 0.2]
    root_linear_velocity_noise: [0.5, 0.5, 0.2]
    root_angular_velocity_noise: [0.52, 0.52, 0.78]
    joint_default_offset_noise: 0.01
  observation_noise:
    enabled: true
    anchor_position: 0.25
    anchor_orientation: 0.05
    base_linear_velocity: 0.5
    base_angular_velocity: 0.2
    joint_position: 0.01
    joint_velocity: 0.5
  adaptive_sampling:
    enabled: true
    bin_seconds: 1.0
    ema_alpha: 0.001
    kernel_size: 3
    kernel_decay: 0.8
    uniform_ratio: 0.1
  push:
    enabled: true
    interval_seconds: [1.0, 3.0]
    linear_velocity: [0.5, 0.5, 0.2]
    angular_velocity: [0.52, 0.52, 0.78]
  reward:
    root_position_weight: 0.5
    root_orientation_weight: 0.5
    joint_position_weight: 0.0
    joint_velocity_weight: 0.0
    body_position_weight: 1.0
    body_orientation_weight: 1.0
    body_velocity_weight: 0.0
    body_linear_velocity_weight: 1.0
    body_angular_velocity_weight: 1.0
    action_rate_weight: -0.1
    joint_limit_weight: -10.0
    undesired_contact_weight: -0.1
    root_position_sigma: 0.3
    root_orientation_sigma: 0.4
    body_position_sigma: 0.3
    body_orientation_sigma: 0.4
    body_linear_velocity_sigma: 1.0
    body_angular_velocity_sigma: 3.141592653589793
    undesired_contact_force_threshold: 1.0
  done:
    root_height_error: 0.25
    root_orientation_error: 0.8
    end_effector_position_error: 0.25

checkpoint_config:
  name: ${motion.sequence}_bello_beyondmimic_seed0
  every_updates: 500

wandb_config:
  enabled: true
  run_name: ${motion.sequence}-bello-beyondmimic-seed0
  tags: [bello, fixed-waist, fixed-head, gmr, beyondmimic]

video_config:
  every_updates: 500
  filename_prefix: ${motion.sequence}_beyondmimic

warp:
  contact_budget_per_env: 64
  njmax: 2048
