syntax = "proto3";

package bello.pose.v1;

// Streams externally estimated rigid transforms without imposing a tracker implementation.
service PoseService {
  rpc WatchPose(WatchPoseRequest) returns (stream WatchPoseResponse);
}

message WatchPoseRequest {
  string reference_frame = 1;
  string tracked_frame = 2;
}

message Translation {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Unit quaternion in renderer-friendly xyzw ordering.
message Orientation {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message WatchPoseResponse {
  string reference_frame = 1;
  string tracked_frame = 2;
  uint64 sequence = 3;
  Translation translation_metres = 4;
  Orientation orientation_xyzw = 5;
  uint64 sample_age_ms = 6;
}
