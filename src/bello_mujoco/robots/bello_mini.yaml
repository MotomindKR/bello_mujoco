asset: bello_mini
# Maintained simulation contract. The upstream hardware profile remains provisional
# until its motor directions, encoder zeros, and ankle differential are calibrated.
source_urdf: bello_mini/urdf/bello_mini.urdf
source_directories:
  - bello_mini/urdf
  - bello_mini/meshes
hardware_description: bello_mini/hardware.yaml
physical_hardware_ready: false
motor_model_catalog: robstride/models.yaml
output_directory: bello_mini
output_stem: bello_mini
root_body_name: bello_mini_root
root_joint_name: root_free
default_root_position: [0.0, 0.0, 0.859]
default_root_quaternion: [1.0, 0.0, 0.0, 0.0]
default_imu_body_name: imu_link
locomotion_command_frame_body_name: pelvis_link
locomotion_forward_axis: [1.0, 0.0, 0.0]
locomotion_action_mirror:
  left_hip_pitch_joint: {counterpart: right_hip_pitch_joint, sign: 1}
  right_hip_pitch_joint: {counterpart: left_hip_pitch_joint, sign: 1}
  left_hip_roll_joint: {counterpart: right_hip_roll_joint, sign: -1}
  right_hip_roll_joint: {counterpart: left_hip_roll_joint, sign: -1}
  left_hip_yaw_joint: {counterpart: right_hip_yaw_joint, sign: -1}
  right_hip_yaw_joint: {counterpart: left_hip_yaw_joint, sign: -1}
  left_knee_joint: {counterpart: right_knee_joint, sign: 1}
  right_knee_joint: {counterpart: left_knee_joint, sign: 1}
  left_ankle_pitch_joint: {counterpart: right_ankle_pitch_joint, sign: 1}
  right_ankle_pitch_joint: {counterpart: left_ankle_pitch_joint, sign: 1}
  left_ankle_roll_joint: {counterpart: right_ankle_roll_joint, sign: -1}
  right_ankle_roll_joint: {counterpart: left_ankle_roll_joint, sign: -1}
  waist_yaw_joint: {counterpart: waist_yaw_joint, sign: -1}
  waist_roll_joint: {counterpart: waist_roll_joint, sign: -1}
foot_body_names:
  - left_ankle_roll_link
  - right_ankle_roll_link
foot_support_geometries:
  - body_name: left_ankle_roll_link
    geom_names:
      - left_ankle_roll_link_sole_heel_center
      - left_ankle_roll_link_sole_main
      - left_ankle_roll_link_sole_heel_negative_y
      - left_ankle_roll_link_sole_heel_positive_y
      - left_ankle_roll_link_sole_toe
  - body_name: right_ankle_roll_link
    geom_names:
      - right_ankle_roll_link_sole_heel_center
      - right_ankle_roll_link_sole_main
      - right_ankle_roll_link_sole_heel_negative_y
      - right_ankle_roll_link_sole_heel_positive_y
      - right_ankle_roll_link_sole_toe
foot_forward_axes:
  - body_name: left_ankle_roll_link
    axis: [1.0, 0.0, 0.0]
  - body_name: right_ankle_roll_link
    axis: [1.0, 0.0, 0.0]
randomization_base_body_name: pelvis_link
randomization_torso_body_name: torso_link
randomization_central_body_names:
  - pelvis_link
  - waist_yaw_link
  - torso_link
actuators:
  - joint_name: left_hip_pitch_joint
    mode: policy
    default_pos: -0.15
    soft_limit: null
    gains: [200.0, 5.0]
    effort_limit: 120.0
  - joint_name: right_hip_pitch_joint
    mode: policy
    default_pos: -0.15
    soft_limit: null
    gains: [200.0, 5.0]
    effort_limit: 120.0
  - joint_name: left_hip_roll_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [150.0, 5.0]
    effort_limit: 60.0
  - joint_name: right_hip_roll_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [150.0, 5.0]
    effort_limit: 60.0
  - joint_name: left_hip_yaw_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [150.0, 5.0]
    effort_limit: 60.0
  - joint_name: right_hip_yaw_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [150.0, 5.0]
    effort_limit: 60.0
  - joint_name: left_knee_joint
    mode: policy
    default_pos: 0.45
    soft_limit: [0.0, 1.2]
    gains: [220.0, 6.0]
    effort_limit: 120.0
  - joint_name: right_knee_joint
    mode: policy
    default_pos: 0.45
    soft_limit: [0.0, 1.2]
    gains: [220.0, 6.0]
    effort_limit: 120.0
  - joint_name: left_ankle_pitch_joint
    mode: policy
    default_pos: -0.30
    soft_limit: null
    gains: [22.0, 1.0]
    effort_limit: 17.0
  - joint_name: right_ankle_pitch_joint
    mode: policy
    default_pos: -0.30
    soft_limit: null
    gains: [22.0, 1.0]
    effort_limit: 17.0
  - joint_name: left_ankle_roll_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [22.0, 1.0]
    effort_limit: 17.0
  - joint_name: right_ankle_roll_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [22.0, 1.0]
    effort_limit: 17.0
  - joint_name: waist_yaw_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [180.0, 12.0]
    effort_limit: 60.0
  - joint_name: waist_roll_joint
    mode: policy
    default_pos: 0.0
    soft_limit: null
    gains: [150.0, 5.0]
    effort_limit: 60.0
  - joint_name: right_shoulder_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [70.0, 2.0]
    effort_limit: 60.0
  - joint_name: right_shoulder_roll_joint
    mode: hold
    default_pos: -0.15
    soft_limit: null
    gains: [70.0, 2.0]
    effort_limit: 60.0
  - joint_name: right_shoulder_yaw_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [20.0, 1.0]
    effort_limit: 36.0
  - joint_name: right_elbow_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [40.0, 2.0]
    effort_limit: 36.0
  - joint_name: right_wrist_yaw_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [20.0, 1.0]
    effort_limit: 14.0
  - joint_name: right_wrist_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [10.0, 1.0]
    effort_limit: 14.0
  - joint_name: right_wrist_roll_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [10.0, 1.0]
    effort_limit: 14.0
  - joint_name: left_shoulder_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [70.0, 2.0]
    effort_limit: 60.0
  - joint_name: left_shoulder_roll_joint
    mode: hold
    default_pos: 0.15
    soft_limit: null
    gains: [70.0, 2.0]
    effort_limit: 60.0
  - joint_name: left_shoulder_yaw_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [20.0, 1.0]
    effort_limit: 36.0
  - joint_name: left_elbow_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [40.0, 2.0]
    effort_limit: 36.0
  - joint_name: left_wrist_yaw_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [20.0, 1.0]
    effort_limit: 14.0
  - joint_name: left_wrist_pitch_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [10.0, 1.0]
    effort_limit: 14.0
  - joint_name: left_wrist_roll_joint
    mode: hold
    default_pos: 0.0
    soft_limit: null
    gains: [10.0, 1.0]
    effort_limit: 14.0
payload_attachments:
  - link_name: left_end_effector_sphere_link
    radius_m: 0.025
    center_m: [0.0, 0.0, -0.025]
  - link_name: right_end_effector_sphere_link
    radius_m: 0.025
    center_m: [0.0, 0.0, -0.025]
# Provisional unit differential matching the pinned Bello Mini URDF. The
# reductions and encoder zeros still require physical calibration.
coupled_actuator_groups:
  - name: left_ankle_differential
    actuators:
      - tendon_name: left_ankle_motor_1
        logical_joint_name: left_ankle_pitch_joint
        joint_coefficients:
          - joint_name: left_ankle_pitch_joint
            coefficient: 1.0
          - joint_name: left_ankle_roll_joint
            coefficient: 1.0
      - tendon_name: left_ankle_motor_2
        logical_joint_name: left_ankle_roll_joint
        joint_coefficients:
          - joint_name: left_ankle_pitch_joint
            coefficient: 1.0
          - joint_name: left_ankle_roll_joint
            coefficient: -1.0
  - name: right_ankle_differential
    actuators:
      - tendon_name: right_ankle_motor_1
        logical_joint_name: right_ankle_pitch_joint
        joint_coefficients:
          - joint_name: right_ankle_pitch_joint
            coefficient: 1.0
          - joint_name: right_ankle_roll_joint
            coefficient: 1.0
      - tendon_name: right_ankle_motor_2
        logical_joint_name: right_ankle_roll_joint
        joint_coefficients:
          - joint_name: right_ankle_pitch_joint
            coefficient: 1.0
          - joint_name: right_ankle_roll_joint
            coefficient: -1.0
