# CPU MuJoCo RobStride hardware-in-the-loop runner.
simulation:
  backend: mujoco_cpu
  asset: full_body
  end_effector_sphere_mode: both_articulated
  ankle_differential_tendons: true
  terrain: flat
  headless: false
  real_time: true
  max_steps: null

joints:
  waist_yaw: true
  waist_roll: false
  waist_pitch: false
  neck_yaw: false
  head_pitch: false

can:
  motor_kind_config: motor_kinds.yaml
  motor_configs:
    - lower_body.yaml
    - upper_body.yaml
  bus_interfaces:
    can0: vcan0
    can1: vcan1
  feedback_rate_hz: 100.0
  temperature_c: 25.0

imu:
  enabled: true
  body_name: pelvis_link
  serial_rate_hz: 200.0
  serial_enabled: true
  serial_device: /dev/ttyIMU-mujoco

torso:
  enabled: true
  drop_limit_m: 0.05
  release_after_seconds: null
