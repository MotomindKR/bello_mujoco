dry_run: true
jit: true

motion:
  directory: motions/local/lafan1_fixed_head
  sequence: walk1_subject1

config:
  seed: 0
  total_timesteps: 100000000
  num_envs: 1024
  num_steps: 24
  update_epochs: 5
  num_minibatches: 8
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  target_kl: null
  min_learning_rate: 0.00001
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  adaptive_kl_statistic: mean
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: true
  value_norm_eps: 0.00000001
  normalize_observations: false
  observation_norm_eps: 0.00001
  observation_norm_clip: 10.0
  rollout_observation_max_abs: 10000.0
  rollout_reward_max_abs: 1000.0
  rollout_value_max_abs: 10000.0
  target_max_abs: 10000.0
  gradient_norm_max: 10000.0
  policy:
    hidden_size: 256
    hidden_depth: 2
    hidden_dims: null
    activation: tanh
    init_log_std: -2.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 4
    action_distribution: tanh_gaussian
    action_limit: 1.0

asset_config:
  asset: full_body
  collision_mode: box
  mesh_face_budget: 1000
  visual_mesh_face_budget: 200000
  end_effector_sphere_mode: both
  target_total_mass_kg: null
  neighbor_exclusion_depth: 2
  enforce_policy_effort_limits: true
  ankle_differential_config:
    motor_gain_scale: 0.5
    motor_effort_limit_scale: 1.0
  joint_availability:
    waist_yaw: true
    waist_roll: false
    waist_pitch: false
    neck_yaw: false
    head_pitch: false
  actuator_config:
    joints:
      left_hip_pitch_joint:
        mode: policy
        default_pos: -0.325
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
        effort_limit: 120.0
      right_hip_pitch_joint:
        mode: policy
        default_pos: 0.325
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
        effort_limit: 120.0
      left_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      right_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      left_hip_yaw_joint:
        mode: policy
        default_pos: 0.125
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      right_hip_yaw_joint:
        mode: policy
        default_pos: -0.125
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      left_knee_joint:
        mode: policy
        default_pos: 0.45
        soft_limit: [0.0, 1.98968]
        gains: [220.0, 6.0]
        effort_limit: 120.0
      right_knee_joint:
        mode: policy
        default_pos: 0.45
        soft_limit: [0.0, 1.98968]
        gains: [220.0, 6.0]
        effort_limit: 120.0
      left_ankle_pitch_joint:
        mode: policy
        default_pos: 0.3
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      right_ankle_pitch_joint:
        mode: policy
        default_pos: 0.3
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      left_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      right_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      waist_yaw_joint:
        mode: policy
        soft_limit: [-0.45, 0.45]
        gains: [180.0, 12.0]
        effort_limit: 120.0
      right_shoulder_pitch_joint:
        mode: policy
        gains: [70.0, 2.0]
        effort_limit: 120.0
      right_shoulder_roll_joint:
        mode: policy
        gains: [70.0, 2.0]
        effort_limit: 60.0
      right_shoulder_yaw_joint:
        mode: policy
        gains: [20.0, 1.0]
        effort_limit: 36.0
      right_elbow_pitch_joint:
        mode: policy
        gains: [40.0, 2.0]
        effort_limit: 36.0
      right_elbow_yaw_joint:
        mode: policy
        gains: [20.0, 1.0]
        effort_limit: 14.0
      right_wrist_pitch_joint:
        mode: policy
        gains: [10.0, 1.0]
        effort_limit: 14.0
      left_shoulder_pitch_joint:
        mode: policy
        gains: [70.0, 2.0]
        effort_limit: 120.0
      left_shoulder_roll_joint:
        mode: policy
        gains: [70.0, 2.0]
        effort_limit: 60.0
      left_shoulder_yaw_joint:
        mode: policy
        gains: [20.0, 1.0]
        effort_limit: 36.0
      left_elbow_pitch_joint:
        mode: policy
        gains: [40.0, 2.0]
        effort_limit: 36.0
      left_elbow_yaw_joint:
        mode: policy
        gains: [20.0, 1.0]
        effort_limit: 14.0
      left_wrist_pitch_joint:
        mode: policy
        gains: [10.0, 1.0]
        effort_limit: 14.0

env_config:
  decimation: 4
  action_clip: 1.0
  terrain:
    mode: plane
    seed: 0
  reset:
    random_start: true
    initial_xy_range: [-1.0, 1.0]
    initial_yaw_range: [-3.141592653589793, 3.141592653589793]
    joint_pos_noise: [-0.02, 0.02]
    joint_vel_noise: [-0.1, 0.1]
  reward:
    root_position_weight: 0.15
    root_orientation_weight: 0.15
    joint_position_weight: 0.20
    joint_velocity_weight: 0.05
    body_position_weight: 0.20
    body_orientation_weight: 0.10
    body_velocity_weight: 0.05
    action_rate_weight: -0.01
    joint_limit_weight: -0.02
    root_position_sigma: 0.20
    root_orientation_sigma: 0.35
    joint_position_sigma: 0.35
    joint_velocity_sigma: 3.0
    body_position_sigma: 0.15
    body_orientation_sigma: 0.45
    body_velocity_sigma: 2.0
  done:
    root_height_error: 0.35
    root_orientation_error: 1.2
    end_effector_position_error: 0.65

checkpoint_config:
  enabled: true
  directory: checkpoints
  name: ${motion.sequence}_wholebody
  every_updates: 100
  resume_path: null
  upload_wandb_artifact: true
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint

wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: wholebody-motion
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: [bello, fixed-waist, fixed-head, gmr]

video_config:
  enabled: true
  every_updates: 100
  render_initial: false
  render_final: true
  output_dir: outputs/motion_tracking/eval_videos
  filename_prefix: ${motion.sequence}_eval
  steps: 300
  width: 640
  height: 480
  fps: 50
  log_wandb: true
  wandb_name: eval/motion_policy

warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 2048

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/train_motion/${now:%Y-%m-%d}/${now:%H-%M-%S}
