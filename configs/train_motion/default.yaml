motion:
  directory: motions/asap_fixed_head
  sequence: video_single_foot_balance_level1_filter_amass

asset_config:
  asset: bello
  target_total_mass_kg: null
  enforce_policy_effort_limits: false
  actuator_mode: policy

config:
  seed: 0
  total_timesteps: 100000000
  num_envs: 1024
  num_steps: 24
  update_epochs: 5
  num_minibatches: 8
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  target_kl: null
  min_learning_rate: 0.00001
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  adaptive_kl_statistic: mean
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: true
  value_norm_eps: 0.00000001
  normalize_observations: false
  observation_norm_eps: 0.00001
  observation_norm_clip: 10.0
  rollout_observation_max_abs: 10000.0
  rollout_reward_max_abs: 1000.0
  rollout_value_max_abs: 10000.0
  target_max_abs: 10000.0
  gradient_norm_max: 10000.0
  policy:
    hidden_dims: [256, 256]
    activation: tanh
    init_log_std: -2.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 4
    action_distribution: tanh_gaussian
    action_limit: 1.0

env_config:
  decimation: 4
  action_clip: 1.0
  terrain:
    mode: plane
    seed: 0
  reset:
    random_start: true
    initial_xy_range: [-1.0, 1.0]
    initial_yaw_range: [-3.141592653589793, 3.141592653589793]
    joint_pos_noise: [-0.02, 0.02]
    joint_vel_noise: [-0.1, 0.1]
  reward:
    root_position_weight: 0.15
    root_orientation_weight: 0.15
    body_position_weight: 0.20
    body_orientation_weight: 0.10
    action_rate_weight: -0.01
    joint_limit_weight: -0.02
    torque_l1_weight: 0.0
    torque_peak_weight: 0.0
    root_position_sigma: 0.20
    root_orientation_sigma: 0.35
    body_position_sigma: 0.15
    body_orientation_sigma: 0.45
  done:
    root_height_error: 0.35
    root_orientation_error: 1.2
    end_effector_position_error: 0.65

checkpoint_config:
  enabled: true
  directory: checkpoints
  name: ${motion.sequence}_wholebody
  every_updates: 100
  resume_path: null
  upload_wandb_artifact: true
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint

wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: wholebody-motion
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: [bello, fixed-waist, fixed-head, gmr]

video_config:
  enabled: true
  every_updates: 100
  render_initial: false
  render_final: true
  output_dir: outputs/motion_tracking/eval_videos
  filename_prefix: ${motion.sequence}_eval
  steps: 300
  width: 640
  height: 480
  fps: 50
  log_wandb: true
  wandb_name: eval/motion_policy

warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 2048
