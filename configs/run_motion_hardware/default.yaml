checkpoint_path: null

hardware:
  endpoint: http://127.0.0.1:50051
  groups: [lower_body, upper_body]
  imu_name: imu
  client_name: bello-motion-policy
  motion_path: null
  start_time_seconds: 0.0
  arm: false
  operator_confirmation: ""
  connection_timeout_seconds: 3.0
  telemetry_timeout_seconds: 2.0
  command_validity_seconds: 0.08
  acknowledgement_timeout_seconds: 0.08
  rpc_timeout_seconds: 2.0
  ramp_seconds: 3.0
  max_duration_seconds: 10.0
  max_motor_age_ms: 100
  max_imu_age_ms: 100
  max_initial_position_error_radians: 0.75
  max_target_step_radians: 0.05
  max_tilt_radians: 0.70
  max_angular_velocity: 20.0
  max_linear_acceleration: 100.0
  max_loop_lag_seconds: 0.10
  kp_scale: 1.0
  kd_scale: 1.0
  status_interval_seconds: 1.0
  max_estimated_linear_velocity: 2.0
  max_estimated_position_error: 0.75

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/run_motion_hardware/${now:%Y-%m-%d}/${now:%H-%M-%S}
