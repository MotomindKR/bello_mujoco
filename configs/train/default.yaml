dry_run: true
jit: true

config:
  seed: 0
  total_timesteps: 1000000
  num_envs: 64
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.001
  anneal_lr: false
  schedule: adaptive
  desired_kl: 0.01
  target_kl: null
  min_learning_rate: 0.00001
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: true
  value_norm_eps: 0.00000001
  policy:
    hidden_size: 256
    hidden_depth: 2
    hidden_dims: null
    activation: tanh
    init_log_std: 0.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 10

asset_config:
  asset: full_body
  collision_mode: mesh
  mesh_face_budget: 1000
  foot_collision_mesh_face_budget: 1000
  visual_mesh_face_budget: 200000
  end_effector_sphere_mode: none
  neighbor_exclusion_depth: 2

env_config:
  decimation: 4
  max_episode_steps: 1000
  action_clip: 5.0
  root_link: bello_root
  spawn:
    clearance: 0.01
    root_xy_range: [0.0, 0.0]
    root_yaw_range: [0.0, 0.0]
    joint_pos_noise: [0.0, 0.0]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  terrain:
    mode: plane
    seed: 0
  gait:
    cycle_time: 0.80
    command_speed_frequency_gain: 0.55
    min_frequency: 1.20
    max_frequency: 2.20
    duty_factor: 0.55
    phase_offsets: [0.0, 0.5]
    standing_command_threshold: 0.05
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: false
    interval_seconds: 5.0
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  observation:
    joint_mode: all_actuated
    base_ang_vel: true
    projected_gravity: true
    gait_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: true
    last_action: true
    scale:
      base_lin_vel: 1.0
      base_ang_vel: 1.0
      projected_gravity: 1.0
      base_height: 1.0
      gait_phase: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 1.0
      actuator_force: 1.0
      last_action: 1.0
    noise:
      enabled: false
      base_lin_vel: [0.0, 0.0]
      base_ang_vel: [-0.2, 0.2]
      projected_gravity: [-0.05, 0.05]
      base_height: [0.0, 0.0]
      gait_phase: [0.0, 0.0]
      command: [0.0, 0.0]
      joint_pos: [-0.01, 0.01]
      joint_vel: [-1.5, 1.5]
      actuator_force: [0.0, 0.0]
      last_action: [0.0, 0.0]

command_config:
  enabled: true
  lin_vel_x: [-0.1, 0.1]
  lin_vel_y: [-0.1, 0.1]
  ang_vel_yaw: [-0.1, 0.1]
  standing_probability: 0.10
  resample_seconds: 10.0
  curriculum:
    enabled: false
    limit_lin_vel_x: [-0.5, 1.0]
    limit_lin_vel_y: [-0.3, 0.3]
    limit_ang_vel_yaw: [-0.2, 0.2]
    expand_ang_vel_yaw: false
    increment: 0.1
    success_threshold: 0.8

checkpoint_config:
  enabled: false
  directory: checkpoints
  name: null
  upload_wandb_artifact: true
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint

wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: null
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: []

video_config:
  enabled: false
  every_updates: 100
  render_initial: false
  render_final: true
  simulation_backend: mujoco
  output_dir: outputs/train_videos
  filename_prefix: rollout
  command: [0.0, 0.0, 0.0]
  steps: 250
  width: 640
  height: 480
  fps: 50
  stop_on_done: true
  stochastic_actions: false
  action_seed: 0
  log_wandb: true
  wandb_name: train/rollout
  camera_config:
    mode: follow
    distance: 3.0
    azimuth: 135.0
    elevation: -18.0
    lookat_offset: [0.0, 0.0, 0.35]

warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 256

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
