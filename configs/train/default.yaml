# Canonical 13-joint Bello locomotion contract. Experiment recipes override only
# task-specific training, randomization, reward-link, and output settings.
config:
  seed: 0
  total_timesteps: 1000000
  num_envs: 64
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  target_kl: null
  min_learning_rate: 1.0e-05
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  adaptive_kl_statistic: max
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: false
  value_norm_eps: 1.0e-08
  normalize_observations: false
  observation_norm_eps: 1.0e-05
  observation_norm_clip: 10.0
  rollout_observation_max_abs: 10000.0
  rollout_reward_max_abs: 1000.0
  rollout_value_max_abs: 10000.0
  target_max_abs: 10000.0
  gradient_norm_max: 10000.0
  symmetry_loss_coef: 0.0
  policy:
    hidden_dims: [256, 256]
    activation: tanh
    init_log_std: 0.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 10
    action_distribution: tanh_gaussian
    action_limit: 1.0
asset_config:
  asset: full_body
  collision_mode: box
  mesh_face_budget: 1000
  visual_mesh_face_budget: 200000
  target_total_mass_kg: null
  end_effector_payload_mass_kg: 0.0
  neighbor_exclusion_depth: 2
  # Match hardware saturation in dynamics. The reward separately measures the
  # unclipped servo demand before this physical limit is applied.
  enforce_policy_effort_limits: true
  ankle_differential_config:
    motor_gain_scale: 0.5
    motor_effort_limit_scale: 1.0
  joint_availability:
    disabled_joint_names: []
env_config:
  decimation: 4
  max_episode_steps: 1000
  action_clip: 1.0
  root_link: pelvis_link
  spawn:
    clearance: 0.01
    root_xy_range: [0.0, 0.0]
    root_yaw_range: [0.0, 0.0]
    joint_pos_noise: [0.0, 0.0]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  terrain:
    mode: plane
    seed: 0
    slope_angle_range: [0.0, 0.0]
  model_randomization:
    enabled: false
    seed: 0
    joint_origin_range: [0.0, 0.0]
    joint_angle_offset_range: [0.0, 0.0]
    joint_angle_offset_scope: all
    joint_inertia_scale_range: [1.0, 1.0]
    torso_mass_scale_range: [1.0, 1.0]
    torso_com_offset_range: [0.0, 0.0]
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: false
    interval_seconds: 5.0
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  numerical_safety:
    max_abs_position: 100.0
    max_abs_velocity: 1000.0
    max_abs_acceleration: 1000000.0
    max_abs_actuator_force: 100000.0
    max_abs_constraint_force: 1000000.0
    max_abs_reward_term: 1000.0
  observation:
    privileged: false
    scale:
      base_lin_vel: 1.0
      base_lin_acc: 0.1
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      command: 1.0
      gait_phase: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 1.0
      last_action: 1.0
    noise:
      enabled: false
  observation_low_pass_filter:
    enabled: false
    cutoff_hz: 10.0
    noise_before_filter: false
    residual_noise_scale: 0.0
  torso_com_curriculum:
    enabled: false
    ramp_steps: 1
  observation_latency:
    enabled: false
    delay_steps: [0, 0]
  gait:
    frequency_hz: 0.9
    stance_fraction: 0.6
  critic_observation:
    privileged: true
    scale:
      base_lin_vel: 2.0
      base_lin_acc: 0.1
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      command: 1.0
      gait_phase: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 0.01
      last_action: 1.0
    noise:
      enabled: false
reward_config:
  weights:
    track_lin_vel_xy: 2.0
    track_ang_vel_z: 2.0
    healthy_survival: 1.5
    lin_vel_z: -2.0
    ang_vel_xy: -0.15
    flat_orientation: -2.0
    base_height: -10.0
    action_rate: -0.01
    action_acceleration: -0.005
    action_limit: -1.0
    torque_l1: -1.2
    torque_peak: -12.0
    joint_force_peak: -4.0
    touchdown_impact: -4.0
    joint_pose: -0.1
    stand_still: 1.0
    stand_foot_motion: -1.0
    stand_foot_heading: -0.5
    stand_contact: -0.5
    stand_upright: -8.0
    hip_deviation: -0.25
    knee_deviation: -0.1
    joint_limit: -1.0
    invalid_action: 0.0
    gait_contact: -1.0
    gait_stance_slip: -0.25
    gait_swing_clearance: -0.5
    undesired_contact: 0.0
    self_collision: 0.0
    termination: -100.0
  links:
    track_lin_vel_xy: null
    track_lin_vel_xy_frame: null
    track_ang_vel_z: null
    lin_vel_z: null
    ang_vel_xy: null
    flat_orientation: null
    base_height: null
  tracking:
    lin_vel_xy_moving_std: 0.3
    lin_vel_xy_still_std: 0.25
    ang_vel_z_moving_std: 0.25
    ang_vel_z_still_std: 0.2
    ang_vel_z_lpf_cutoff_hz: 5.0
  standing:
    foot_linear_speed_scale: 0.15
    foot_angular_speed_scale: 1.0
    foot_angular_weight: 0.25
    foot_heading_deadband: 0.0872664626
    foot_heading_scale: 0.2617993878
  gait:
    stance_slip_angular_speed_scale: 0.0
    swing_clearance_target: 0.08
    joint_force_soft_limit_body_weights: 0.8
    joint_force_top_k: 2
    joint_force_apply_while_standing: false
    touchdown_force_soft_limit_body_weights: 0.6
    touchdown_vertical_speed_scale: 0.3
  smoothness:
    ankle_action_weight: 2.0
    waist_action_weight: 2.0
  limits_pose:
    base_height_target: 0.86
    action_soft_limit_ratio: 0.8
    joint_soft_limit_factor: 0.9
    hip_lateral_command_index: 0
    hip_lateral_command_threshold: 0.1
command_config:
  enabled: true
  lin_vel_x: [-0.5, 0.5]
  lin_vel_y: [-0.5, 0.5]
  ang_vel_yaw: [-0.5, 0.5]
  standing_probability: 0.1
  linear_deadband: 0.1
  yaw_deadband: 0.1
  minimum_moving_linear_speed: 0.2
  minimum_moving_yaw_speed: 0.2
  resample_seconds: 10.0
  standing_transitions_enabled: false
checkpoint_config:
  enabled: false
  directory: checkpoints
  name: null
  every_updates: null
  resume_path: null
  allow_git_commit_mismatch: false
  upload_wandb_artifact: true
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint
wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: null
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: []
video_config:
  enabled: false
  every_updates: 100
  render_initial: false
  render_final: true
  output_dir: outputs/train_videos
  filename_prefix: rollout
  command: [0.0, 0.0, 0.0]
  steps: 250
  width: 640
  height: 480
  fps: 50
  stop_on_done: true
  stochastic_actions: false
  action_seed: 0
  log_wandb: true
  wandb_name: train/rollout
  camera_config:
    mode: follow
    distance: 3.0
    azimuth: 135.0
    elevation: -18.0
    lookat_offset: [0.0, 0.0, 0.35]
warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 256
