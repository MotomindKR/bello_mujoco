# Canonical 13-joint Bello locomotion contract. Experiment recipes override only
# task-specific training, randomization, reward-link, and output settings.
dry_run: true
jit: true
config:
  seed: 0
  total_timesteps: 1000000
  num_envs: 64
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  target_kl: null
  min_learning_rate: 1.0e-05
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  adaptive_kl_statistic: max
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: false
  value_norm_eps: 1.0e-08
  normalize_observations: false
  observation_norm_eps: 1.0e-05
  observation_norm_clip: 10.0
  rollout_observation_max_abs: 10000.0
  rollout_reward_max_abs: 1000.0
  rollout_value_max_abs: 10000.0
  target_max_abs: 10000.0
  gradient_norm_max: 10000.0
  policy:
    hidden_size: 256
    hidden_depth: 2
    hidden_dims: null
    activation: tanh
    init_log_std: 0.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 10
    action_distribution: tanh_gaussian
    action_limit: 1.0
asset_config:
  asset: full_body
  collision_mode: box
  mesh_face_budget: 1000
  visual_mesh_face_budget: 200000
  end_effector_sphere_mode: both
  target_total_mass_kg: null
  neighbor_exclusion_depth: 2
  ankle_differential_config:
    motor_gain_scale: 0.5
    motor_effort_limit_scale: 1.0
  joint_availability:
    waist_yaw: true
    waist_roll: true
    waist_pitch: true
    neck_yaw: true
    head_pitch: true
  actuator_config:
    joints:
      left_hip_pitch_joint:
        mode: policy
        default_pos: -0.325
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
        effort_limit: 120.0
      right_hip_pitch_joint:
        mode: policy
        default_pos: 0.325
        soft_limit: [-1.41372, 1.41372]
        gains: [200.0, 5.0]
        effort_limit: 120.0
      left_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      right_hip_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      left_hip_yaw_joint:
        mode: policy
        default_pos: 0.125
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      right_hip_yaw_joint:
        mode: policy
        default_pos: -0.125
        soft_limit: [-1.41372, 1.41372]
        gains: [150.0, 5.0]
        effort_limit: 60.0
      left_knee_joint:
        mode: policy
        default_pos: 0.45
        soft_limit: [0.0, 1.98968]
        gains: [220.0, 6.0]
        effort_limit: 120.0
      right_knee_joint:
        mode: policy
        default_pos: 0.45
        soft_limit: [0.0, 1.98968]
        gains: [220.0, 6.0]
        effort_limit: 120.0
      left_ankle_pitch_joint:
        mode: policy
        default_pos: 0.3
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      right_ankle_pitch_joint:
        mode: policy
        default_pos: 0.3
        soft_limit: [-0.44506, 0.96866]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      left_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      right_ankle_roll_joint:
        mode: policy
        default_pos: 0.0
        soft_limit: [-0.07857, 0.07857]
        gains: [22.0, 1.0]
        effort_limit: 36.0
      waist_yaw_joint:
        mode: policy
        soft_limit: [-0.45, 0.45]
        gains: [180.0, 12.0]
        effort_limit: 120.0
      waist_roll_joint:
        mode: hold
        gains: [240.0, 20.0]
        effort_limit: 120.0
      waist_pitch_joint:
        mode: hold
        gains: [240.0, 20.0]
        effort_limit: 120.0
      neck_yaw_joint:
        mode: hold
        gains: [5.5, 0.5]
        effort_limit: 5.5
      head_pitch_joint:
        mode: hold
        gains: [5.5, 0.5]
        effort_limit: 5.5
      right_shoulder_pitch_joint:
        mode: hold
        gains: [70.0, 2.0]
        effort_limit: 120.0
      right_shoulder_roll_joint:
        mode: hold
        gains: [70.0, 2.0]
        effort_limit: 60.0
      right_shoulder_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
        effort_limit: 36.0
      right_elbow_pitch_joint:
        mode: hold
        gains: [40.0, 2.0]
        effort_limit: 36.0
      right_elbow_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
        effort_limit: 14.0
      right_wrist_pitch_joint:
        mode: hold
        gains: [10.0, 1.0]
        effort_limit: 14.0
      left_shoulder_pitch_joint:
        mode: hold
        gains: [70.0, 2.0]
        effort_limit: 120.0
      left_shoulder_roll_joint:
        mode: hold
        gains: [70.0, 2.0]
        effort_limit: 60.0
      left_shoulder_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
        effort_limit: 36.0
      left_elbow_pitch_joint:
        mode: hold
        gains: [40.0, 2.0]
        effort_limit: 36.0
      left_elbow_yaw_joint:
        mode: hold
        gains: [20.0, 1.0]
        effort_limit: 14.0
      left_wrist_pitch_joint:
        mode: hold
        gains: [10.0, 1.0]
        effort_limit: 14.0
env_config:
  decimation: 4
  max_episode_steps: 1000
  action_clip: 1.0
  root_link: pelvis_link
  spawn:
    clearance: 0.01
    root_xy_range: [0.0, 0.0]
    root_yaw_range: [0.0, 0.0]
    joint_pos_noise: [0.0, 0.0]
    joint_vel_range: [0.0, 0.0]
    stagger_initial_step_count: false
  terrain:
    mode: plane
    seed: 0
    slope_angle_range: [0.0, 0.0]
  model_randomization:
    enabled: false
    seed: 0
    joint_origin_range: [0.0, 0.0]
    joint_angle_offset_range: [0.0, 0.0]
    joint_angle_offset_scope: all
    joint_inertia_scale_range: [1.0, 1.0]
  contact:
    foot_contact_on_seconds: 0.0
    foot_contact_off_seconds: 0.0
    foot_contact_force_threshold: 1.0
    undesired_contact_force_threshold: 1.0
    self_collision_force_threshold: 1.0
  random_push:
    enabled: false
    interval_seconds: 5.0
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  numerical_safety:
    max_abs_position: 100.0
    max_abs_velocity: 1000.0
    max_abs_acceleration: 1000000.0
    max_abs_actuator_force: 100000.0
    max_abs_constraint_force: 1000000.0
    max_abs_reward_term: 1000.0
  observation:
    privileged: false
    scale:
      base_lin_vel: 1.0
      base_lin_acc: 0.1
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 1.0
      last_action: 1.0
    noise:
      enabled: false
  critic_observation:
    privileged: true
    scale:
      base_lin_vel: 2.0
      base_lin_acc: 0.1
      base_ang_vel: 0.2
      projected_gravity: 1.0
      base_height: 1.0
      command: 1.0
      joint_pos: 1.0
      joint_vel: 0.05
      actuator_force: 0.01
      last_action: 1.0
    noise:
      enabled: false
reward_config:
  track_lin_vel_xy:
    weight: 1.0
    link: null
    moving_std: 0.75
    still_std: 0.25
    command_deadband: 0.1
    frame_link: null
  track_ang_vel_z:
    weight: 1.0
    link: null
    moving_std: 0.5
    still_std: 0.2
    command_deadband: 0.1
  lin_vel_z:
    weight: -2.0
    link: null
  ang_vel_xy:
    weight: -0.15
    link: null
  flat_orientation:
    weight: -2.0
    link: null
  base_height:
    weight: -10.0
    link: null
    target_height: 0.86
  action_rate:
    weight: -0.01
  action_limit:
    weight: -1.0
    soft_limit_ratio: 0.8
  torque_l1:
    weight: -2.5e-05
  joint_pose:
    weight: -0.1
  stand_dual_contact:
    weight: 2.0
    command_speed_threshold: 0.1
    linear_velocity_sigma: 0.04
    yaw_velocity_sigma: 0.04
  hip_deviation:
    weight: -0.25
    lateral_command_index: 1
    lateral_command_threshold: 0.1
  knee_deviation:
    weight: -0.1
  joint_limit:
    weight: -1.0
    soft_limit_factor: 0.9
  invalid_action:
    weight: 0.0
  foot_slip:
    weight: -0.25
    angular_speed_scale: 0.0
  flight:
    weight: -2.0
    command_speed_threshold: 0.1
    body_speed_threshold: 0.1
    yaw_speed_threshold: 0.1
  contact_timing:
    weight: -5.0
    min_air_time: 0.2
    min_contact_time: 0.3
    command_speed_threshold: 0.1
    body_speed_threshold: 0.1
    yaw_speed_threshold: 0.1
  touchdown_air_time:
    weight: 0.5
    min_air_time: 0.2
    max_air_time: 0.5
    command_speed_threshold: 0.1
    body_speed_threshold: 0.1
    yaw_speed_threshold: 0.1
  undesired_contact:
    weight: 0.0
  self_collision:
    weight: 0.0
  termination:
    weight: -100.0
command_config:
  enabled: true
  lin_vel_x: [-0.1, 0.1]
  lin_vel_y: [-0.1, 0.1]
  ang_vel_yaw: [-0.1, 0.1]
  standing_probability: 0.1
  resample_seconds: 10.0
checkpoint_config:
  enabled: false
  directory: checkpoints
  name: null
  every_updates: null
  resume_path: null
  upload_wandb_artifact: true
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint
wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: null
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: []
video_config:
  enabled: false
  every_updates: 100
  render_initial: false
  render_final: true
  simulation_backend: mujoco
  output_dir: outputs/train_videos
  filename_prefix: rollout
  command: [0.0, 0.0, 0.0]
  steps: 250
  width: 640
  height: 480
  fps: 50
  stop_on_done: true
  stochastic_actions: false
  action_seed: 0
  log_wandb: true
  wandb_name: train/rollout
  camera_config:
    mode: follow
    distance: 3.0
    azimuth: 135.0
    elevation: -18.0
    lookat_offset: [0.0, 0.0, 0.35]
warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 256
hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
