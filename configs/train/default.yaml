dry_run: true
jit: true

config:
  seed: 0
  total_timesteps: 1000000
  num_envs: 64
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.001
  anneal_lr: false
  schedule: adaptive
  desired_kl: 0.01
  min_learning_rate: 0.00001
  max_learning_rate: 0.01
  adaptive_lr_factor: 1.5
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: true
  value_norm_eps: 0.00000001
  policy:
    hidden_size: 256
    hidden_depth: 2
    activation: tanh
    init_log_std: 0.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 10

asset_config:
  asset: full_body
  collision_mode: mesh
  mesh_face_budget: 1000
  foot_collision_mesh_face_budget: 1000
  visual_mesh_face_budget: 200000
  end_effector_sphere_mode: none
  neighbor_exclusion_depth: 2

env_config:
  decimation: 10
  max_episode_steps: 1000
  root_link: bello_root
  spawn:
    clearance: 0.01
  terrain:
    mode: plane
    seed: 0
  gait:
    cycle_time: 0.80
    duty_factor: 0.55
    phase_offsets: [0.0, 0.5]
    standing_command_threshold: 0.05
  observation:
    joint_mode: all_actuated
    base_ang_vel: true
    projected_gravity: true
    gait_phase: true
    command: true
    joint_pos: true
    joint_vel: true
    actuator_force: true
    last_action: true

command_config:
  enabled: true
  lin_vel_x: [-0.1, 0.1]
  lin_vel_y: [-0.1, 0.1]
  ang_vel_yaw: [-0.1, 0.1]
  standing_probability: 0.02
  resample_seconds: 10.0

checkpoint_config:
  enabled: false
  directory: checkpoints
  name: null
  overwrite: true
  upload_wandb_artifact: false
  wandb_artifact_name: null
  wandb_artifact_type: checkpoint

wandb_config:
  enabled: false
  project: bello-mujoco
  entity: null
  group: null
  job_type: train
  run_name: null
  mode: online
  dir: .wandb
  tags: []

metric_config:
  stream_updates: true

video_config:
  enabled: false
  every_updates: 10
  render_initial: false
  render_final: true
  simulation_backend: mujoco
  output_dir: outputs/train_videos
  filename_prefix: rollout
  command: [0.0, 0.0, 0.0]
  steps: 250
  width: 640
  height: 480
  fps: 50
  stop_on_done: true
  log_wandb: true
  wandb_name: train/rollout
  camera_config:
    mode: follow
    distance: 3.0
    azimuth: 135.0
    elevation: -18.0
    lookat_offset: [0.0, 0.0, 0.35]

warp:
  contact_budget_per_env: 32
  naconmax: null
  naccdmax: null
  njmax: 256

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
