# Short Vast.ai end-to-end training smoke.
# Runs one small PPO update, writes a final checkpoint, uploads it to W&B,
# and logs a short rollout video.
defaults:
  - default
  - _self_

dry_run: false

config:
  total_timesteps: 2048
  num_envs: 64
  num_steps: 32
  update_epochs: 1
  num_minibatches: 1

checkpoint_config:
  enabled: true
  name: vast_smoke_seed0
  upload_wandb_artifact: true

wandb_config:
  enabled: true
  project: bello-mujoco
  run_name: vast_smoke_seed0
  tags: [vast, smoke, full-body]

video_config:
  enabled: true
  every_updates: 1
  steps: 80
  filename_prefix: vast_smoke
