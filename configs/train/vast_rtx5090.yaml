# Vast.ai RTX 5090 training preset.
# This expects a 1x RTX 5090 instance with at least 64 GiB CPU RAM.
defaults:
  - rtx5090_4096x256
  - _self_

checkpoint_config:
  enabled: true
  name: vast_rtx5090_seed0
  upload_wandb_artifact: true
  wandb_artifact_name: vast_rtx5090_seed0

wandb_config:
  enabled: true
  project: bello-mujoco
  run_name: vast_rtx5090_seed0
  tags: [vast, rtx5090, full-body, mesh-collision]

video_config:
  enabled: true
  every_updates: 25
  filename_prefix: vast_rtx5090
