protocol: linker_o6
listen: 127.0.0.1:50057
lease_timeout_seconds: 1.0
left_can_interface: can2
right_can_interface: can3
left_hand_enabled: true
right_hand_enabled: true
can_probe_timeout_seconds: 0.5
can_feedback_poll_interval_seconds: 0.2
can_feedback_timeout_seconds: 0.5
can_tx_spacing_seconds: 0.003
xrobot:
  endpoint: 127.0.0.1:50052
  tls_root_certificate_path: null
  tls_server_name_override: null
  connect_timeout_seconds: 5.0
  rpc_timeout_seconds: 2.0
  max_source_age_ms: 500
  max_source_interval_seconds: 0.70
  transport_latency_budget_ms: 10.0
  max_rate_hz: 60.0
max_reference_age_ms: 500
control_rate_hz: 5.0
smoothing_time_constant_ms: 100.0
max_raw_rate_per_second: 510.0
finger_full_flex_degrees: 180.0
thumb_full_flex_degrees: 120.0
thumb_adduction_range_degrees: 60.0
minimum_segment_length_m: 0.004
left_open_positions: [255, 255, 255, 255, 255, 255]
left_closed_positions: [0, 0, 0, 0, 0, 0]
right_open_positions: [255, 255, 255, 255, 255, 255]
right_closed_positions: [0, 0, 0, 0, 0, 0]
duration_seconds: null
arm: false
calibration_confirmed: false
hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/hands/${now:%Y-%m-%d}/${now:%H-%M-%S}
