checkpoint_path: null

eval_config:
  command: [0.0, 0.0, 0.0]
  steps: null
  stop_on_done: false
  simulation_backend: mujoco
  stochastic_actions: false
  action_seed: 0
  gamepad:
    enabled: true
    controller_index: 0
    deadzone: 0.1
  runtime:
    source: checkpoint
    asset_config:
      joint_availability:
        waist_yaw: true
        waist_roll: true
        waist_pitch: true
        neck_yaw: true
        head_pitch: true

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/eval_policy/${now:%Y-%m-%d}/${now:%H-%M-%S}
