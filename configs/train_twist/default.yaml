stage: teacher
dataset_index: datasets/twist/index.json
teacher_checkpoint_path: null

config:
  seed: 0
  total_timesteps: 5898240000
  num_envs: 4096
  num_steps: 24
  update_epochs: 5
  num_minibatches: 4
  learning_rate: 0.0002
  schedule: adaptive
  desired_kl: 0.008
  target_kl: null
  min_learning_rate: 0.00001
  max_learning_rate: 0.0002
  adaptive_lr_factor: 1.5
  adaptive_kl_statistic: mean
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 1.0
  normalize_value: true
  normalize_observations: false
  policy:
    hidden_dims: [512, 512, 256, 128]
    activation: swish
    init_log_std: 0.0
    min_log_std: -5.0
    max_log_std: 1.0
    obs_stack_size: 1
    action_distribution: tanh_gaussian
    action_limit: 1.0
    architecture: twist_teacher
    layer_norm_final_hidden: true

motion_env:
  decimation: 10
  action_clip: 1.0
  formulation: beyondmimic_joint_limits
  anchor_body_name: torso_link
  reset:
    random_start: true
    initial_xy_range: [-1.0, 1.0]
    initial_yaw_range: [-3.141592653589793, 3.141592653589793]
    joint_pos_noise: [-0.1, 0.1]
    joint_vel_noise: [-0.2, 0.2]
    root_position_noise: [0.05, 0.05, 0.02]
    root_rotation_noise: [0.1, 0.1, 0.2]
    root_linear_velocity_noise: [0.5, 0.5, 0.2]
    root_angular_velocity_noise: [0.52, 0.52, 0.78]
    joint_default_offset_noise: 0.01
  push:
    enabled: true
    interval_seconds: [1.0, 3.0]
    linear_velocity: [0.5, 0.5, 0.2]
    angular_velocity: [0.52, 0.52, 0.78]

twist_env:
  max_episode_steps: 500
  action_delay_steps: [0, 2]
  observation_noise:
    enabled: true
    base_angular_velocity: 0.05
    roll_pitch: 0.02
    joint_position: 0.01
    joint_velocity: 0.1
  key_body_names:
    - pelvis_link
    - torso_link
    - left_ankle_roll_link
    - right_ankle_roll_link
    - l_wrist_link
    - r_wrist_link
    - left_knee_link
    - right_knee_link
    - l_elbow_link

checkpoint_config:
  enabled: true
  directory: checkpoints
  name: twist_teacher_seed0
  every_updates: 500
  resume_path: null
  allow_git_commit_mismatch: false
  upload_wandb_artifact: true
  wandb_artifact_name: twist_teacher_seed0
  wandb_artifact_type: checkpoint

wandb_config:
  enabled: true
  project: bello-mujoco
  entity: null
  group: twist
  job_type: train
  run_name: twist_teacher_seed0
  mode: online
  dir: .wandb
  tags: [twist, teacher, whole-body]

warp:
  contact_budget_per_env: 64
  naconmax: null
  naccdmax: null
  njmax: 2048

runtime_clip_directory: outputs/twist_runtime_clips
