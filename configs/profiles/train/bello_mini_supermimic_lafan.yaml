# Reference-comparison baseline: full unofficial batches and 14,000 updates.
# Hardware filtering/delay commissioning is separate from these baselines.
max_training_seconds: null
config:
  total_timesteps: 143622144
  num_envs: 4096
  max_episode_steps: 500
  replay_steps: 1000
  max_replay_bytes: 17179869184
  model_batches: 10
  model_batch_size: 2048
  imagined_batch_size: 4096
environment:
  reset:
    initial_xy_range: [0.0, 0.0]
    initial_yaw_range: [0.0, 0.0]
    joint_pos_noise: [-0.1, 0.1]
    joint_vel_noise: [0.0, 0.0]
    root_position_noise: [0.05, 0.05, 0.01]
    root_rotation_noise: [0.1, 0.1, 0.2]
    root_linear_velocity_noise: [0.5, 0.5, 0.2]
    root_angular_velocity_noise: [0.52, 0.52, 0.78]
    joint_default_offset_noise: 0.01
  randomization:
    joint_angle_offset_range: [0.0, 0.0]
    friction_range: [0.3, 1.2]
networks:
  matmul_precision: bfloat16
checkpoint_config:
  name: bello_mini_supermimic_lafan_seed${config.seed}
  every_updates: 2000
checkpoint_evaluation:
  enabled: true
  windows:
    - {clip: dance2_subject1, start_frame: 10027, max_steps: 400}
    - {clip: jumps1_subject1, start_frame: 11613, max_steps: 400}
    - {clip: fallAndGetUp1_subject1, start_frame: 7500, max_steps: 400}
    - {clip: fightAndSports1_subject1, start_frame: 990, max_steps: 400}
wandb_config:
  group: bello-mini-supermimic-lafan
  run_name: bello_mini_supermimic_lafan_seed${config.seed}
