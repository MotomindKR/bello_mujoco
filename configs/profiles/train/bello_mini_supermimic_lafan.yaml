# Whole LAFAN sequences; random starts and ten-second collection episodes.
# The wall-time budget bounds this experiment, not the paper's full schedule.
max_training_seconds: 4500
config:
  num_envs: 2048
  max_episode_steps: 500
  replay_steps: 512
  max_replay_bytes: 17179869184
  model_batches: 5
  model_batch_size: 1024
  imagined_batch_size: 1024
networks:
  matmul_precision: tensorfloat32
checkpoint_config:
  name: bello_mini_supermimic_lafan_seed${config.seed}
  every_updates: 1000
wandb_config:
  group: bello-mini-supermimic-lafan
  run_name: bello_mini_supermimic_lafan_seed${config.seed}
