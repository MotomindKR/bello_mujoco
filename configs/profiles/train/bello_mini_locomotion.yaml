# Mini cadence is specified in alternating footsteps, not full strides.
asset_config:
  asset: bello_mini
  enforce_policy_effort_limits: true
  joint_soft_limits:
    left_knee_joint: [0.0, 1.2]
    right_knee_joint: [0.0, 1.2]
  imu_config:
    enabled: false
    body_name: imu_link
env_config:
  command_delay_seconds: 0.01
  gait:
    speed_dependent: true
    step_frequency_base: 1.6
    step_frequency_speed_gain: 0.35
    stop_extra_steps: 1
    command_slew_enabled: true
    command_linear_slew_rate: 1.0
    command_yaw_slew_rate: 1.0
    directional_start: true
    lateral_start_deadband: 0.1
    standing_reward_ramp_seconds: 0.2
  random_push:
    # Per-world control steps: 488282 * 2048 is approximately 1B transitions.
    curriculum_steps: 488282
    initial_scale: 0.2
    lin_vel_x: [-0.5, 0.5]
    lin_vel_y: [-0.5, 0.5]
  spawn:
    # Independent scaling would break the coordinated flat-sole crouch.
    joint_pos_scale_range: [1.0, 1.0]
    # Learn recovery from scheduled disturbances, not six-axis reset kicks.
    root_vel_range: [0.0, 0.0]
reward_config:
  tracking:
    # exp(-error^2 / std^2): match the reference 0.25 denominator.
    lin_vel_xy_moving_std: 0.5
    lin_vel_xy_still_std: 0.5
    ang_vel_z_moving_std: 0.5
    ang_vel_z_still_std: 0.5
  weights:
    healthy_survival: 2.25
    moving_lin_vel_xy_error: -1.0
    moving_ang_vel_z_error: -1.0
    stand_motor_continuous_torque_excess: -8.0
    stand_still: 0.0
    stand_contact: 0.0
    stand_foot_motion: 0.0
    stand_foot_heading: 0.0
    stand_upright: 0.0
    hip_deviation: 0.0
    knee_deviation: 0.0
    flat_orientation: -5.0
    joint_pose: -1.0
    foot_heading: -1.0
    foot_slip: -0.5
    gait_stance_slip: 0.0
    gait_contact: -2.5
    gait_swing_clearance: -1.0
    stand_foot_foreaft: -0.25
    stand_foot_width: -0.25
    foot_crossing: -8.0
    foot_stumble: -2.0
  standing:
    position_deadband: 0.02
    position_scale: 0.05
    contact_independent_alignment: true
  gait:
    swing_clearance_target: 0.075
    phase_shaped_clearance: true
    crossing_scale: 0.02
    sole_clearance_margin: 0.02
    stumble_grace_fraction: 0.15
    stumble_load_body_weights: 0.05
    stumble_speed_scale: 0.15
  limits_pose:
    base_height_target: 0.87
    hip_deviation_command_indices: [0]
    knee_deviation_apply_while_moving: false
    # One shared pose cost; pitch/knee/ankles retain room for corrective steps.
    joint_pose_weights:
      - [left_hip_pitch_joint, 0.05]
      - [right_hip_pitch_joint, 0.05]
      - [left_hip_roll_joint, 1.0]
      - [right_hip_roll_joint, 1.0]
      - [left_hip_yaw_joint, 1.0]
      - [right_hip_yaw_joint, 1.0]
      - [left_knee_joint, 0.05]
      - [right_knee_joint, 0.05]
      - [left_ankle_pitch_joint, 0.1]
      - [right_ankle_pitch_joint, 0.1]
      - [left_ankle_roll_joint, 0.1]
      - [right_ankle_roll_joint, 0.1]
      - [waist_yaw_joint, 2.0]
      - [waist_roll_joint, 2.0]
command_config:
  lin_vel_x: [-0.5, 0.5]
  lin_vel_y: [-0.5, 0.5]
done_config:
  base_height:
    min_height: 0.56
checkpoint_config:
  every_updates: 1024
  name: bello_mini_locomotion_seed0
  wandb_artifact_name: bello_mini_locomotion_seed0
wandb_config:
  group: bello-mini-locomotion
  run_name: bello_mini_locomotion_seed0
  tags: [locomotion, bello-mini, ideal-differential-ankle, seeded-plane-slope, additive-push-xy05]
video_config:
  standing_push_enabled: true
  standing_suite_enabled: true
  every_updates: 8192
  filename_prefix: bello_mini_locomotion
  command: [0.5, 0.0, 0.0]
  steps: 500
