# First single-GPU learning pilot; preserves the full actor/dynamics architecture.
config:
  total_timesteps: 2097152
  num_envs: 128
  replay_steps: 512
  max_replay_bytes: 1073741824
  model_batches: 2
  model_batch_size: 256
  imagined_batch_size: 256
  learning_rate_decay_updates: 5000
checkpoint_config:
  name: bello_mini_supermimic_pilot_seed${config.seed}
  every_updates: 1000
wandb_config:
  group: bello-mini-supermimic-pilot
  run_name: bello_mini_supermimic_pilot_seed${config.seed}
