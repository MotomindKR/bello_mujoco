minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu-24.04

vmType: vz
arch: aarch64
mountType: virtiofs
cpus: 8
memory: 12GiB
disk: 80GiB

param:
  ENVIRONMENT: bello-mujoco-vcan-v1
  NETWORKING_REVISION: native-visualizer-v1
  REPO_DIR: /REPLACE/WHEN/CREATING/INSTANCE

mounts:
  - location: "{{.Param.REPO_DIR}}"
    mountPoint: /workspace/bello_mujoco
    writable: true

containerd:
  system: false
  user: false

hostResolver:
  enabled: true
  ipv6: false

portForwards:
  - guestPortRange: [50051, 50053]
    hostPortRange: [50051, 50053]
    hostIP: 127.0.0.1
    proto: tcp
  - guestPort: 50054
    proto: tcp
    ignore: true
  - guestPort: 50055
    hostPort: 50055
    hostIP: 127.0.0.1
    proto: tcp
  - guestPortRange: [1, 65535]
    proto: any
    ignore: true

video:
  display: none

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      [[ '{{.Param.ENVIRONMENT}}' == bello-mujoco-vcan-v1 ]]
      [[ '{{.Param.NETWORKING_REVISION}}' == native-visualizer-v1 ]]

      required_packages=(
        ca-certificates
        curl
        git
        iproute2
        kmod
        socat
        xz-utils
        "linux-modules-extra-$(uname -r)"
      )
      missing_packages=()
      for package in "${required_packages[@]}"; do
        if ! dpkg-query --show --showformat='${Status}' "$package" 2>/dev/null \
          | grep -q '^install ok installed$'; then
          missing_packages+=("$package")
        fi
      done
      if (( ${#missing_packages[@]} )); then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install --yes --no-install-recommends "${missing_packages[@]}"
      fi

      if ! modinfo vcan >/dev/null 2>&1; then
        echo "The vcan kernel module is unavailable for $(uname -r)." >&2
        echo "Verify linux-modules-extra-$(uname -r) is installed, then reboot the VM." >&2
        exit 1
      fi

      nix_setup=/workspace/bello_mujoco/scripts/setup_lima_nix.sh
      if [[ ! -x $nix_setup ]]; then
        echo "Bello Nix setup is unavailable at $nix_setup." >&2
        exit 1
      fi
      "$nix_setup"

      emulator_setup=/workspace/bello_mujoco/scripts/setup_emulator.sh
      if [[ ! -x $emulator_setup ]]; then
        echo "Bello repository is not mounted at /workspace/bello_mujoco." >&2
        exit 1
      fi
      "$emulator_setup" start

probes:
  - mode: readiness
    description: Nix, vCAN, and the emulated IMU endpoints to be ready
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      test -x /nix/var/nix/profiles/default/bin/nix
      test -e /workspace/bello_mujoco/.git
      ip -details -json link show dev vcan0 | grep -q '"info_kind":"vcan"'
      ip -details -json link show dev vcan1 | grep -q '"info_kind":"vcan"'
      test -L /dev/ttyIMU
      test -L /dev/ttyIMU-mujoco
    hint: |
      Inspect /var/log/cloud-init-output.log. Rerun bootstrap to repair a
      transient Nix installer download failure. The VM also needs the Ubuntu
      kernel's matching linux-modules-extra package before vcan can load.

message: |
  Bello's Linux vCAN guest is ready.
  Run: ./scripts/lima_vcan.sh bootstrap
  Then open each process with: ./scripts/lima_vcan.sh run <command>
