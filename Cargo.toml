[workspace]
resolver = "3"
members = ["rust/bello-policy"]
exclude = ["deps/bello-stack"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
anyhow = "1"
bello-hardware-client = { path = "deps/bello-stack/components/bello-hardware-client" }
bello-pose-api = { path = "deps/bello-stack/components/bello-pose-api" }
robstride-protocol = { path = "deps/bello-stack/components/robstride-protocol" }
clap = "4"
serde = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio = "1"
tonic = "0.14"
