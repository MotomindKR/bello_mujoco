[project]
name = "bello-mujoco"
version = "0.1.0"
description = "MuJoCo/MJX robot-learning environment managed by uv."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "chex>=0.1.90",
  "equinox>=0.12.0",
  "grpcio>=1.83,<2",
  "hydra-core>=1.3.2",
  "imageio-ffmpeg>=0.6.0",
  "jax>=0.6.0",
  "keyring>=25.6.0",
  "mujoco==3.12.0",
  "mujoco-mjx[warp]==3.12.0",
  "numpy>=2.0",
  "omegaconf>=2.3.0",
  "onnx>=1.19,<2",
  "optax>=0.2.4",
  "orbax-checkpoint>=0.11.0",
  "pygame-ce>=2.5.7",
  "protobuf>=7.35.1,<8",
  "rerun-sdk==0.34.1",
  "tqdm>=4.67.0",
  "trimesh>=4.6.0",
  "vastai>=1.3,<2",
  "wandb>=0.28.0",
]

[project.urls]
Repository = "https://github.com/MotomindKR/bello_mujoco"

[project.scripts]
bello-train = "bello_mujoco.cli:train_entrypoint"
bello-eval = "bello_mujoco.cli:eval_entrypoint"
bello-export-policy = "bello_mujoco.cli:export_entrypoint"
bello-vast-train = "bello_mujoco.cli:vast_train_entrypoint"
bello-run-hands = "bello_mujoco.cli:hands_entrypoint"
bello-run-reference = "bello_mujoco.cli:reference_entrypoint"

[dependency-groups]
training = [
  "jax[cuda13]>=0.6.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
  "grpcio-tools>=1.83,<2",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
retargeting = [
  "daqp==0.8.7",
  "mink==1.2.0",
  "qpsolvers==4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bello_mujoco"]

[tool.uv]
default-groups = ["dev", "retargeting"]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
norecursedirs = ["deps", "outputs", ".venv", ".uv-python"]
tmp_path_retention_policy = "failed"
markers = [
  "integration: full robot dynamics, compiled rollouts, or external runtime checks; opt in explicitly",
]

[tool.ruff]
extend-exclude = [
  "src/bello_mujoco/hardware/_pose_pb2.py",
  "src/bello_mujoco/hardware/_remote_pb2.py",
  "src/bello_mujoco/hardware/reference_pb2.py",
]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F"]
ignore = [
  # Frozen configuration values are intentionally safe shared defaults.
  "B008",
]
