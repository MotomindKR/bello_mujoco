[project]
name = "bello-mujoco"
version = "0.1.0"
description = "MuJoCo/MJX robot-learning environment managed by uv."
requires-python = ">=3.12,<3.13"
dependencies = [
  "chex>=0.1.90",
  "equinox>=0.12.0",
  "fast-simplification>=0.1.12",
  "hydra-core>=1.3.2",
  "imageio[ffmpeg]>=2.37.3",
  "jax>=0.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "jax[cuda13]>=0.6.0; sys_platform == 'linux'",
  "jaxtyping>=0.3.0",
  "keyring>=25.6.0",
  "mujoco>=3.3.0",
  "mujoco-mjx[warp]>=3.3.0",
  "optax>=0.2.4",
  "orbax-checkpoint>=0.11.0",
  "pygame-ce>=2.5.7",
  "rerun-sdk==0.34.1",
  "rlax>=0.1.7",
  "tqdm>=4.67.0",
  "trimesh>=4.6.0",
  "tyro>=0.9.0",
  "vastai>=0.2.0",
  "wandb>=0.28.0",
]

[project.scripts]
bello-prepare-assets = "bello_mujoco.tools.prepare_assets:entrypoint"
bello-smoke-env = "bello_mujoco.tools.smoke_env:entrypoint"
bello-benchmark-env = "bello_mujoco.tools.benchmark_env:entrypoint"
bello-train-ppo = "bello_mujoco.tools.train_ppo:entrypoint"
bello-eval-policy = "bello_mujoco.tools.eval_policy:entrypoint"
bello-ppo-cartpole-smoke = "bello_mujoco.tools.ppo_cartpole_smoke:entrypoint"
bello-vast-train = "bello_mujoco.tools.vast_train:entrypoint"
bello-vast-playground = "bello_mujoco.tools.vast_playground:entrypoint"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bello_mujoco"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "bello_mujoco/configs"
"assets/source" = "bello_mujoco/assets/source"

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
markers = [
  "integration: slower end-to-end tests that compile and run training loops",
]
